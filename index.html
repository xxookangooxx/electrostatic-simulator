<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>静电场 · 电荷引导大师</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #0a0e14;
            overflow: hidden;
            font-family: system-ui, -apple-system, "PingFang SC", monospace;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game { display: block; width: 100%; height: 100%; touch-action: none; }

        /* ===== HUD 面板 ===== */
        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between;
            padding: 10px 16px;
            pointer-events: none;
            z-index: 20;
            gap: 10px;
        }
        .hud-panel {
            background: rgba(12, 22, 32, 0.88);
            border: 1.5px solid #2d5a6e;
            border-radius: 14px;
            padding: 10px 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.5), inset 0 0 12px rgba(50, 120, 160, 0.08);
            display: flex; gap: 18px; align-items: center;
        }
        .stat {
            display: flex; flex-direction: column; align-items: flex-start;
            min-width: 76px;
        }
        .stat-label {
            font-size: 10px; color: #5e8fa8;
            letter-spacing: 1.2px; text-transform: uppercase;
            margin-bottom: 3px; font-weight: 600;
        }
        .stat-value {
            font-size: 20px; font-weight: 800;
            color: #d4f0ff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 0 12px rgba(100, 180, 255, 0.4);
            transition: color 0.4s ease;
            white-space: nowrap;
        }
        .stat-unit {
            font-size: 10px; color: #4a7a92;
            margin-left: 3px; font-weight: 600;
        }
        .stat.timer .stat-value { color: #7dd8a0; text-shadow: 0 0 12px rgba(125, 216, 160, 0.4); }
        .stat.timer.warning .stat-value { color: #ffa502; text-shadow: 0 0 14px rgba(255, 165, 2, 0.6); }
        .stat.timer.critical .stat-value { color: #ff4757; text-shadow: 0 0 16px rgba(255, 71, 87, 0.8); animation: pulse 0.9s infinite; }
        .stat.flip .stat-value { color: #ffa8d8; text-shadow: 0 0 12px rgba(255, 130, 200, 0.4); }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        /* ===== 提示条 ===== */
        #toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 30, 45, 0.94);
            color: #a8d8ff; padding: 10px 24px;
            border-radius: 30px; font-size: 14px;
            border: 1px solid #3d7186;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 12px rgba(100,180,255,0.2);
            opacity: 0; transition: all 0.35s ease;
            pointer-events: none; z-index: 30;
            letter-spacing: 0.3px; font-weight: 600;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { border-color: #2ed573; color: #b0ffc8; box-shadow: 0 0 18px rgba(46,213,115,0.4); }
        #toast.warn { border-color: #ffa502; color: #ffe0a0; box-shadow: 0 0 18px rgba(255,165,2,0.4); }

        /* ===== 游戏内菜单按钮 ===== */
        #menuBtn {
            position: fixed; top: 16px; right: 16px;
            width: 42px; height: 42px;
            background: rgba(20, 40, 55, 0.85);
            border: 1.5px solid #3d7186;
            border-radius: 12px;
            color: #8fc4dd;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
            transition: all 0.2s ease;
            pointer-events: auto;
            opacity: 0; visibility: hidden;
        }
        #menuBtn.visible { opacity: 1; visibility: visible; }
        #menuBtn:hover {
            background: rgba(35, 70, 95, 0.95);
            border-color: #6ad4ff;
            color: #ffffff;
        }

        /* ===== 开始界面 ===== */
        #startScreen {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, #0f1e2e 0%, #060a10 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease, visibility 0.5s;
            overflow-y: auto; padding: 30px 20px;
        }
        #startScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .start-logo {
            font-size: 48px; font-weight: 900;
            color: #a8d8ff;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.6), 0 0 60px rgba(100, 180, 255, 0.3);
            margin-bottom: 8px;
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .start-sub {
            color: #5e8fa8; font-size: 15px;
            letter-spacing: 4px; margin-bottom: 40px;
            text-transform: uppercase;
        }

        .start-grid {
            display: grid; gap: 10px;
            max-width: 820px; width: 100%;
            margin-bottom: 28px;
        }
        .start-grid.model-grid { grid-template-columns: repeat(6, 1fr); }
        .start-grid.mode-grid { grid-template-columns: repeat(3, 1fr); }

        .start-label {
            color: #6b9fc0; font-size: 12px; letter-spacing: 2.5px;
            margin-bottom: 12px; text-transform: uppercase;
            text-align: center; font-weight: 600;
        }

        .start-item {
            background: rgba(20, 40, 55, 0.7);
            border: 1.5px solid #2d5a6e;
            color: #8fc4dd;
            padding: 14px 8px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            min-width: 90px;
        }
        .start-item:hover {
            background: rgba(35, 70, 95, 0.9);
            border-color: #5aa8cc;
            color: #d4f0ff;
            transform: translateY(-2px);
        }
        .start-item.selected {
            background: rgba(45, 110, 150, 0.85);
            border-color: #6ad4ff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(106, 212, 255, 0.5);
        }
        .start-item .item-icon { font-size: 22px; display: block; margin-bottom: 5px; }
        .start-item .item-desc {
            font-size: 10px; color: #6b9fc0;
            font-weight: 400; margin-top: 3px; display: block;
        }
        .start-item.selected .item-desc { color: #b0e0ff; }

        .start-play {
            margin-top: 8px;
            background: linear-gradient(135deg, #1e6b8c, #2d8fb5);
            border: 2px solid #6ad4ff;
            color: #ffffff;
            padding: 16px 80px;
            border-radius: 50px;
            font-size: 20px; font-weight: 900;
            letter-spacing: 6px; cursor: pointer;
            box-shadow: 0 8px 28px rgba(45, 143, 181, 0.6), 0 0 40px rgba(106, 212, 255, 0.4);
            transition: all 0.2s ease;
            animation: playPulse 2s ease-in-out infinite;
        }
        @keyframes playPulse {
            0%, 100% { box-shadow: 0 8px 28px rgba(45, 143, 181, 0.6), 0 0 40px rgba(106, 212, 255, 0.4); }
            50% { box-shadow: 0 8px 28px rgba(45, 143, 181, 0.8), 0 0 60px rgba(106, 212, 255, 0.7); }
        }
        .start-play:hover {
            transform: translateY(-3px) scale(1.03);
        }
        .start-play:active { transform: translateY(0) scale(1); }

        .start-help {
            margin-top: 32px;
            display: flex; gap: 28px; flex-wrap: wrap;
            justify-content: center;
            color: #5e8fa8; font-size: 12px;
            letter-spacing: 0.5px;
        }
        .start-help kbd {
            background: rgba(45, 110, 150, 0.5);
            border: 1px solid #3d7186;
            border-radius: 6px;
            padding: 2px 8px;
            font-family: monospace;
            color: #b0e0ff;
            font-weight: 700;
            margin-right: 4px;
        }

        /* ===== 暂停/菜单界面 ===== */
        #pauseScreen {
            position: fixed; inset: 0;
            background: rgba(6, 10, 18, 0.92);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 150;
            transition: opacity 0.3s ease, visibility 0.3s;
        }
        #pauseScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .pause-title {
            color: #a8d8ff; font-size: 28px; font-weight: 800;
            letter-spacing: 4px; margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
        }
        .pause-btn {
            background: rgba(20, 40, 55, 0.9);
            border: 1.5px solid #3d7186;
            color: #8fc4dd;
            padding: 14px 48px;
            border-radius: 40px;
            font-size: 16px; font-weight: 700;
            letter-spacing: 2px; cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            min-width: 220px;
        }
        .pause-btn:hover {
            background: rgba(45, 110, 150, 0.9);
            border-color: #6ad4ff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(106, 212, 255, 0.4);
        }
        .pause-btn.primary {
            background: linear-gradient(135deg, #1e6b8c, #2d8fb5);
            border-color: #6ad4ff;
            color: #ffffff;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD 面板 -->
<div id="hud">
    <div class="hud-panel" id="panelLeft">
        <div class="stat flip">
            <div class="stat-label">⇄ 翻转</div>
            <div class="stat-value"><span id="flipVal">0</span></div>
        </div>
    </div>
    <div class="hud-panel" id="panelRight">
        <div class="stat timer" id="statTimer">
            <div class="stat-label">⏱ 时间</div>
            <div class="stat-value"><span id="timeVal">0.0</span><span class="stat-unit">s</span></div>
        </div>
    </div>
</div>

<!-- 提示 -->
<div id="toast"></div>

<!-- 菜单按钮 -->
<button id="menuBtn" title="菜单">☰</button>

<!-- ===== 开始界面 ===== -->
<div id="startScreen">
    <div class="start-logo">⚡ 电荷引导大师</div>
    <div class="start-sub">静电场 · 多模型 · 随机事件</div>

    <div class="start-label">选择电场模型</div>
    <div class="start-grid model-grid" id="startModelGrid"></div>

    <div class="start-label" style="margin-top: 20px;">选择游戏模式</div>
    <div class="start-grid mode-grid" id="startModeGrid">
        <div class="start-item selected" data-mode="classic">
            <span class="item-icon">🎯</span>
            经典模式
            <span class="item-desc">无限时间 · 通关得分</span>
        </div>
        <div class="start-item" data-mode="timed">
            <span class="item-icon">⏱</span>
            限时挑战
            <span class="item-desc">60 秒内完成</span>
        </div>
        <div class="start-item" data-mode="endless">
            <span class="item-icon">♾</span>
            无尽模式
            <span class="item-desc">连续通关 · 难度递增</span>
        </div>
    </div>

    <button class="start-play" id="startPlay">开始游戏</button>

    <div class="start-help">
        <span><kbd>空格</kbd> 暂停 / 继续</span>
        <span><kbd>R</kbd> 重新开始</span>
        <span><kbd>M</kbd> 菜单</span>
        <span><kbd>1-9</kbd> 快速切换模型</span>
    </div>
</div>

<!-- ===== 暂停/菜单界面 ===== -->
<div id="pauseScreen" class="hidden">
    <div class="pause-title">⏸ 已暂停</div>
    <button class="pause-btn primary" id="resumeBtn">继续游戏</button>
    <button class="pause-btn" id="restartBtn">重新开始</button>
    <button class="pause-btn" id="backToMenuBtn">返回主菜单</button>
</div>

<script>
(function () {
'use strict';

// ============================================================
//  基础工具
// ============================================================
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist  = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

// ============================================================
//  数值显示 —— 仅保留计时和翻转计数
// ============================================================
const display = {
    time: { el: document.getElementById('timeVal'), current: 0, target: 0, timer: 0, decimals: 1, updateInterval: 0.2, deadZone: 0.05, lerp: 10 },
    flip: { el: document.getElementById('flipVal'), current: 0, target: 0, timer: 0, decimals: 0, updateInterval: 0, deadZone: 0, lerp: 1 },
};

function updateDisplayValues(dt) {
    for (const key in display) {
        const d = display[key];
        if (d.updateInterval > 0) {
            d.timer += dt;
            if (d.timer < d.updateInterval) continue;
            d.timer = 0;
        }
        const diff = d.target - d.current;
        if (Math.abs(diff) < d.deadZone) {
            if (Math.abs(diff) > 0.0001) { d.current = d.target; d.el.textContent = d.current.toFixed(d.decimals); }
            continue;
        }
        const smooth = 1 - Math.pow(1 / (1 + d.lerp), dt * 60);
        d.current += diff * smooth;
        if (Math.abs(d.target - d.current) < d.deadZone * 0.5) d.current = d.target;
        d.el.textContent = d.current.toFixed(d.decimals);
    }
}

function setTimeDisplay(t) {
    display.time.target = t;
    const stat = document.getElementById('statTimer');
    let newClass = 'stat timer';
    if (state.timeLimit > 0) {
        if (t <= 5) newClass += ' critical';
        else if (t <= 10) newClass += ' warning';
    }
    if (stat.className !== newClass) stat.className = newClass;
}
function setFlipDisplay(count) {
    document.getElementById('flipVal').textContent = count;
}

// ============================================================
//  Toast
// ============================================================
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg, duration = 1800, type = '') {
    toastEl.textContent = msg;
    toastEl.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ''; }, duration);
}

// ============================================================
//  音效
// ============================================================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
    }
}
function playTone(freq, dur, type = 'sine', vol = 0.06) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
}
function sfxFlip(pos) { playTone(pos ? 700 : 420, 0.12, 'triangle', 0.06); }
function sfxWin() { playTone(523, 0.14, 'sine', 0.08); setTimeout(() => playTone(659, 0.14), 110); setTimeout(() => playTone(784, 0.28), 220); }
function sfxEvent() { playTone(300, 0.2, 'sawtooth', 0.04); }
function sfxClick() { playTone(500, 0.05, 'sine', 0.04); }

// ============================================================
//  画布初始化
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ============================================================
//  物理参数
// ============================================================
const SOFT       = 34;
const Q_FIXED    = 1.8e7;
const MASS       = 0.055;
const DRAG       = 0.52;
const MAX_SPEED  = 380;
const FAR_BOOST  = 0.008;
const WALL_BOUNCE = 0.45;
const SHELL_BOUNCE = 0.35;

// ============================================================
//  游戏状态
// ============================================================
const state = {
    test:    null,
    fixed:   [],
    goal:    null,
    flipped: 0,
    elapsed: 0,
    phase:   'playing',
    trail:   [],
    winAt:   0,
    modelIndex: 0,
    particles: [],
    dragging: null,
    mouseX: 0, mouseY: 0,
    mouseInCanvas: false,
    hoverTarget: null,
    paused: false,
    mode: 'classic',
    timeLimit: 0,
    timeRemaining: 0,
    level: 1,
    totalScore: 0,
    eventTimer: 0,
    eventInterval: 12,
    activeEvents: [],
    running: false,
};

// ============================================================
//  随机事件
// ============================================================
const RANDOM_EVENTS = [
    {
        id: 'charge_flip',
        apply: () => {
            for (const c of state.fixed) {
                if (Math.random() < 0.6) { c.sign *= -1; c.pulse = 1; }
            }
            sfxEvent();
            showToast('⚡ 电荷紊乱！极性随机翻转', 2000, 'warn');
        }
    },
    {
        id: 'gravity', duration: 8,
        apply: () => showToast('🌍 引力场出现！小球向下加速', 2000, 'warn'),
        tick: (dt) => { if (state.test) state.test.vy += 180 * dt; }
    },
    {
        id: 'wind', duration: 8,
        apply: () => showToast('💨 电场风来袭！横向扰动', 2000, 'warn'),
        tick: (dt) => { if (state.test) state.test.vx += Math.sin(performance.now() / 300) * 120 * dt; }
    },
    {
        id: 'boost',
        apply: () => {
            if (state.test) {
                const a = rnd(0, Math.PI * 2);
                state.test.vx += Math.cos(a) * 250;
                state.test.vy += Math.sin(a) * 250;
            }
            sfxEvent();
            showToast('🚀 电场加速！', 1500, 'success');
        }
    },
    {
        id: 'teleport',
        apply: () => {
            if (state.test) {
                for (let attempt = 0; attempt < 300; attempt++) {
                    const x = rnd(50, W - 50);
                    const y = rnd(50, H - 50);
                    if (isValidTestPos(x, y)) {
                        state.test.x = x; state.test.y = y;
                        state.test.vx = 0; state.test.vy = 0;
                        break;
                    }
                }
            }
            sfxEvent();
            showToast('🌀 小球被传送到了随机位置！', 1800, 'warn');
        }
    },
];

// ============================================================
//  位置有效性检查
// ============================================================
function isValidTestPos(x, y) {
    for (const c of state.fixed) {
        if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + state.test.r + 5) return false;
        if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < state.test.r + 10) return false;
        if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + state.test.r + 5) return false;
        if (c.type === 'line' && Math.abs(x - c.x) < state.test.r + 15) return false;
    }
    if (x < 30 || x > W - 30 || y < 30 || y > H - 30) return false;
    return true;
}

// ============================================================
//  模型定义
// ============================================================
const MODELS = [
    {
        name: '双电荷', icon: '⚡', desc: '经典偶极子',
        elements: () => {
            const S = Math.min(W, H);
            const margin = Math.max(70, S * 0.20);
            return [
                { type: 'point', x: margin, y: H * 0.30, sign: 1 },
                { type: 'point', x: W - margin, y: H * 0.70, sign: -1 },
            ];
        },
    },
    {
        name: '四极子', icon: '✚', desc: '两对交替电荷',
        elements: () => {
            const S = Math.min(W, H);
            const cx = W / 2, cy = H / 2, d = S * 0.30;
            return [
                { type: 'point', x: cx - d, y: cy - d, sign: 1 },
                { type: 'point', x: cx + d, y: cy - d, sign: -1 },
                { type: 'point', x: cx - d, y: cy + d, sign: -1 },
                { type: 'point', x: cx + d, y: cy + d, sign: 1 },
            ];
        },
    },
    {
        name: '圆环', icon: '◎', desc: '均匀带电圆环',
        elements: () => {
            const S = Math.min(W, H);
            return [{ type: 'ring', x: W / 2, y: H / 2, R: S * 0.28, sign: 1, charge: 2.5 }];
        },
    },
    {
        name: '圆盘', icon: '●', desc: '均匀带电圆盘',
        elements: () => {
            const S = Math.min(W, H);
            return [{ type: 'disk', x: W / 2, y: H / 2, R: S * 0.30, sign: 1, charge: 3.0 }];
        },
    },
    {
        name: '直线', icon: '│', desc: '无限长带电直线',
        elements: () => [{ type: 'line', x: W / 2, y1: 0, y2: H, sign: 1, charge: 2.0 }],
    },
    {
        name: '平行板', icon: '▬', desc: '匀强电场',
        elements: () => {
            const S = Math.min(W, H);
            const margin = Math.max(60, S * 0.16);
            const n = 5, xs = [];
            for (let i = 0; i < n; i++) xs.push(margin + (i / (n - 1)) * (W - 2 * margin));
            const topY = margin, botY = H - margin;
            const charges = [];
            xs.forEach(x => charges.push({ type: 'point', x, y: topY, sign: 1 }));
            xs.forEach(x => charges.push({ type: 'point', x, y: botY, sign: -1 }));
            return charges;
        },
    },
    {
        name: '六角环', icon: '⬡', desc: '六边形交替电荷',
        elements: () => {

            const charges = [];
            for (let i = 0; i < 6; i++) {

            return [
                { type: 'point', x: cx - d, y: cy - d * 0.6, sign: 1 },

                else if (r < 0.92) type = 'ring';

                charges.push({

                    x: pos.x, y: pos.y,

                    charge: rnd(1.2, 2.5),

                    let ok = true;
                    for (const p of placed) if (dist(x, y, p.x, p.y) < S * 0.14) { ok = false; break; }
                    if (ok) { pos = { x, y }; break; }
                }
                if (!pos) pos = { x: rnd(50, W - 50), y: rnd(50, H - 50) };
                placed.push(pos);
                const r = Math.random();
                charges.push({
                    type: r < 0.55 ? 'point' : (r < 0.80 ? 'ring' : 'disk'),

                    sign: Math.random() < 0.5 ? 1 : -1,
                    R: rnd(S * 0.10, S * 0.20),

//  开始界面初始化

function initStartScreen() {
    const modelGrid = document.getElementById('startModelGrid');
    modelGrid.innerHTML = '';
    MODELS.forEach((m, i) => {
        const el = document.createElement('div');
        el.className = 'start-item' + (i === state.modelIndex ? ' selected' : '');
        el.dataset.index = i;
        el.innerHTML = `<span class="item-icon">${m.icon}</span>${m.name}<span class="item-desc">${m.desc}</span>`;
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            sfxClick();
            state.modelIndex = i;
            document.querySelectorAll('#startModelGrid .start-item').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        });
        modelGrid.appendChild(el);
    });

    document.querySelectorAll('#startModeGrid .start-item').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            sfxClick();
            state.mode = el.dataset.mode;
            document.querySelectorAll('#startModeGrid .start-item').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        });
    });

    document.getElementById('startPlay').addEventListener('click', (e) => {
        e.stopPropagation();
        initAudio();
        sfxClick();
        startGame();
    });
}

function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('menuBtn').classList.add('visible');
    state.running = true;
    state.paused = false;
    newGame();
}

// ============================================================
//  放置固定带电体
// ============================================================
function placeFixedCharges() {
    const S = Math.min(W, H);
    const fixedR = clamp(S * 0.028, 14, 24);
    const shellR = fixedR * 1.38;

    const raw = MODELS[state.modelIndex].elements();
    return raw.map(c => {
        if (c.type === 'point') {
            return { type: 'point', x: c.x, y: c.y, r: fixedR, shellR, sign: c.sign, pulse: 0 };
        } else if (c.type === 'ring') {
            return { type: 'ring', x: c.x, y: c.y, R: c.R, sign: c.sign, charge: c.charge || 2.0, pulse: 0, shellR: 0 };
        } else if (c.type === 'disk') {
            return { type: 'disk', x: c.x, y: c.y, R: c.R, sign: c.sign, charge: c.charge || 3.0, pulse: 0, shellR: 0 };
        } else if (c.type === 'line') {
            return { type: 'line', x: c.x, y1: c.y1 !== undefined ? c.y1 : 0, y2: c.y2 !== undefined ? c.y2 : H, sign: c.sign, charge: c.charge || 2.0, pulse: 0, shellR: 0 };
        }
        return c;
    });
}

// ============================================================
//  开一局新游戏
// ============================================================
function newGame() {
    state.flipped = 0;
    state.elapsed = 0;
    state.phase   = 'playing';
    state.trail   = [];
    state.particles = [];
    state.dragging = null;
    state.hoverTarget = null;
    state.eventTimer = 0;
    state.activeEvents = [];
    state.paused = false;

    display.time.current = 0; display.time.target = 0;
    display.flip.current = 0; display.flip.target = 0;
    document.getElementById('timeVal').textContent = '0.0';
    document.getElementById('flipVal').textContent = '0';

    if (state.mode === 'timed') {
        state.timeLimit = 60;
        state.timeRemaining = 60;
        showToast('⏱ 限时模式：60 秒内完成！', 2500, 'warn');
    } else if (state.mode === 'endless') {
        state.timeLimit = 0;
        state.timeRemaining = 0;
        state.level = 1;
        showToast('♾ 无尽模式：连续通关，难度递增！', 2500, 'success');
    } else {
        state.timeLimit = 0;
        state.timeRemaining = 0;
        state.level = 1;
    }

    const S = Math.min(W, H);
    const margin = Math.max(55, S * 0.13);

    state.fixed = placeFixedCharges();

    // 试验电荷：左侧区域
    const testR = clamp(S * 0.022, 11, 18);
    let testPos = null;
    for (let attempt = 0; attempt < 600; attempt++) {
        const x = rnd(margin, W * 0.30);
        const y = rnd(margin, H - margin);
        let ok = true;
        for (const c of state.fixed) {
            if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + testR + 20) { ok = false; break; }
            if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < testR + 20) { ok = false; break; }
            if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + testR + 20) { ok = false; break; }
            if (c.type === 'line' && Math.abs(x - c.x) < testR + 30) { ok = false; break; }
        }
        if (ok) { testPos = { x, y }; break; }
    }
    if (!testPos) testPos = { x: W * 0.15, y: H / 2 };
    state.test = { x: testPos.x, y: testPos.y, vx: 0, vy: 0, r: testR };

    // 目标：右侧区域
    const goalR = clamp(S * 0.070, 36, 55);
    let goalPos = null;
    for (let attempt = 0; attempt < 600; attempt++) {
        const x = rnd(W * 0.65, W - margin);
        const y = rnd(margin, H - margin);
        if (dist(x, y, state.test.x, state.test.y) < goalR * 2.5) continue;
        let ok = true;
        for (const c of state.fixed) {
            if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + goalR + 24) { ok = false; break; }
            if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < goalR + 24) { ok = false; break; }
            if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + goalR + 24) { ok = false; break; }
            if (c.type === 'line' && Math.abs(x - c.x) < goalR + 30) { ok = false; break; }
        }
        if (ok) { goalPos = { x, y }; break; }
    }
    if (!goalPos) goalPos = { x: W * 0.80, y: H * 0.70 };
    state.goal = { x: goalPos.x, y: goalPos.y, r: goalR };
}

// ============================================================
//  电场计算
// ============================================================
function fieldRing(t, c) {
    const dx = t.x - c.x, dy = t.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { fx: 0, fy: 0 };
    const nx = dx / d, ny = dy / d;
    const q = c.sign * c.charge * Q_FIXED;
    if (d > c.R * 2.5) {
        const d2 = d * d + SOFT * SOFT;
        const r = Math.sqrt(d2);
        const k = q / (d2 * r) * (1 + r * FAR_BOOST);
        return { fx: k * dx, fy: k * dy };
    }
    const d2 = d * d + SOFT * SOFT;
    const r = Math.sqrt(d2);
    const k = q / (d2 * r) * (1 + r * FAR_BOOST);
    const radialFactor = d > c.R ? 1.0 : d / c.R;
    const ringPenalty = Math.exp(-Math.abs(d - c.R) / (c.R * 0.3)) * 0.8;
    return { fx: k * nx * (radialFactor + ringPenalty), fy: k * ny * (radialFactor + ringPenalty) };
}

function fieldDisk(t, c) {
    const dx = t.x - c.x, dy = t.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { fx: 0, fy: 0 };
    const nx = dx / d, ny = dy / d;
    const q = c.sign * c.charge * Q_FIXED;
    if (d > c.R * 3) {
        const d2 = d * d + SOFT * SOFT;
        const r = Math.sqrt(d2);
        const k = q / (d2 * r) * (1 + r * FAR_BOOST);
        return { fx: k * dx, fy: k * dy };
    }
    const d2 = d * d + SOFT * SOFT;
    const r = Math.sqrt(d2);
    const k = q / (d2 * r) * (1 + r * FAR_BOOST);
    const factor = d > c.R ? 1.0 : -d / c.R * 0.6;
    const diskPenalty = Math.exp(-Math.abs(d - c.R) / (c.R * 0.25)) * 1.0;
    return { fx: k * nx * (factor + diskPenalty), fy: k * ny * (factor + diskPenalty) };
}

function fieldLine(t, c) {
    const dx = t.x - c.x;
    const d = Math.abs(dx);
    if (d < 1) return { fx: 0, fy: 0 };
    const nx = dx / d;
    const q = c.sign * c.charge * Q_FIXED;
    const k = q / (d * (d + SOFT)) * (1 + d * FAR_BOOST);
    return { fx: k * nx, fy: 0 };
}

// ============================================================
//  逻辑更新
// ============================================================
function update(dt) {
    for (let i = 0; i < state.fixed.length; i++) {
        const c = state.fixed[i];
        if (c.pulse > 0) c.pulse = Math.max(0, c.pulse - dt * 4);
    }
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt; p.vx *= 0.98; p.vy *= 0.98;
        if (p.life <= 0) state.particles.splice(i, 1);
    }

    updateDisplayValues(dt);

    if (!state.running) return;
    if (state.phase !== 'playing') return;
    if (state.paused) return;

    state.elapsed += dt;

    if (state.timeLimit > 0) {
        state.timeRemaining = Math.max(0, state.timeLimit - state.elapsed);
        setTimeDisplay(state.timeRemaining);
        if (state.timeRemaining <= 0) {
            state.phase = 'lost';
            showToast('⏱ 时间到！任务失败', 2500, 'warn');
            return;
        }
    } else {
        setTimeDisplay(state.elapsed);
    }

    state.eventTimer += dt;
    if (state.eventTimer >= state.eventInterval) {
        state.eventTimer = 0;
        state.eventInterval = Math.max(6, 12 - state.level * 1.5);
        triggerRandomEvent();
    }

    for (let i = state.activeEvents.length - 1; i >= 0; i--) {
        const ev = state.activeEvents[i];
        ev.remaining -= dt;
        if (ev.tick) ev.tick(dt);
        if (ev.remaining <= 0) {
            if (ev.cleanup) ev.cleanup();
            state.activeEvents.splice(i, 1);
        }
    }

    const t = state.test;

    if (state.dragging && state.dragging.type === 'test') {
        const d = state.dragging;
        t.x = clamp(state.mouseX + d.offsetX, t.r + 2, W - t.r - 2);
        t.y = clamp(state.mouseY + d.offsetY, t.r + 2, H - t.r - 2);
        t.vx = 0; t.vy = 0;
    } else {
        let fx = 0, fy = 0;
        for (let i = 0; i < state.fixed.length; i++) {
            const c = state.fixed[i];
            let f;
            if (c.type === 'point') {
                const q = c.sign * Q_FIXED;
                const dx = t.x - c.x, dy = t.y - c.y;
                const d2 = dx * dx + dy * dy + SOFT * SOFT;
                const r = Math.sqrt(d2);
                const k = q / (d2 * r) * (1 + r * FAR_BOOST);
                f = { fx: k * dx, fy: k * dy };
            } else if (c.type === 'ring') f = fieldRing(t, c);
            else if (c.type === 'disk') f = fieldDisk(t, c);
            else if (c.type === 'line') f = fieldLine(t, c);
            else f = { fx: 0, fy: 0 };
            fx += f.fx; fy += f.fy;
        }

        t.vx += (fx - DRAG * t.vx) / MASS * dt;
        t.vy += (fy - DRAG * t.vy) / MASS * dt;

        const sp = Math.hypot(t.vx, t.vy);
        if (sp > MAX_SPEED) {
            t.vx = t.vx / sp * MAX_SPEED;
            t.vy = t.vy / sp * MAX_SPEED;
        }

        t.x += t.vx * dt;
        t.y += t.vy * dt;
    }

    const px = t.x, py = t.y;

    const pad = t.r + 2;
    if (t.x < pad) { t.x = pad; t.vx = Math.abs(t.vx) * WALL_BOUNCE; }
    else if (t.x > W - pad) { t.x = W - pad; t.vx = -Math.abs(t.vx) * WALL_BOUNCE; }
    if (t.y < pad) { t.y = pad; t.vy = Math.abs(t.vy) * WALL_BOUNCE; }
    else if (t.y > H - pad) { t.y = H - pad; t.vy = -Math.abs(t.vy) * WALL_BOUNCE; }

    for (let i = 0; i < state.fixed.length; i++) {
        const c = state.fixed[i];
        if (c.type !== 'point') continue;
        const dx = t.x - c.x, dy = t.y - c.y;
        let d = Math.hypot(dx, dy);
        const minD = c.shellR + t.r;
        if (d < minD) {
            if (d < 0.001) { t.x = c.x + minD; t.y = c.y; t.vx = 0; t.vy = 0; }
            else {
                const nx = dx / d, ny = dy / d;
                t.x = c.x + nx * minD;
                t.y = c.y + ny * minD;
                const vn = t.vx * nx + t.vy * ny;
                if (vn < 0) {
                    t.vx -= vn * nx * (1 + SHELL_BOUNCE);
                    t.vy -= vn * ny * (1 + SHELL_BOUNCE);
                    const col = c.sign > 0 ? '#ff5c6c' : '#4d7cff';
                    spawnParticles(t.x, t.y, 4, col);
                }
            }
        }
    }

    if (Math.hypot(t.x - px, t.y - py) > 2.0) {
        state.trail.push({ x: t.x, y: t.y });
        if (state.trail.length > 55) state.trail.shift();
    }

    // 抵达目标即通关（不再需要收集）
    const gd = dist(t.x, t.y, state.goal.x, state.goal.y);
    if (gd < state.goal.r) {
        state.phase = 'won';
        state.winAt = performance.now();
        for (let i = 0; i < 20; i++) spawnParticles(state.goal.x, state.goal.y, 1, '#2ed573');
        sfxWin();
        if (state.mode === 'endless') {
            state.level++;
            state.totalScore += Math.max(1, Math.floor(1000 - state.elapsed * 10));
            setTimeout(() => { if (state.phase === 'won' && state.running) newGame(); }, 1800);
        }
    }
}

function triggerRandomEvent() {
    const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
    if (ev.duration) {
        state.activeEvents.push({
            id: ev.id,
            remaining: ev.duration,
            tick: ev.tick,
            cleanup: ev.cleanup,
        });
    }
    ev.apply();
}

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const a = rnd(0, Math.PI * 2);
        const sp = rnd(40, 160);
        state.particles.push({
            x, y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            life: rnd(0.3, 0.8),
            maxLife: 0.8,
            color: color,
            r: rnd(1.5, 3.5),
        });
    }
}

// ============================================================
//  渲染
// ============================================================
function render() {
    const now = performance.now();
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = '#151a24';
    ctx.lineWidth = 0.6;
    ctx.globalAlpha = 0.5;
    const gridSize = 60;
    for (let x = 0; x <= W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    if (!state.running) return;

    drawGoal(now);
    drawTrail();
    drawFixedCharges(now);
    drawTestCharge(now);
    drawParticles();

    if (state.phase === 'won') drawWinOverlay();
    if (state.phase === 'lost') drawLostOverlay();
}

function drawGoal(now) {
    const g = state.goal;
    if (!g) return;
    const pulse = 1 + Math.sin(now / 380) * 0.06;
    const R = g.r * pulse;

    const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, R);
    grad.addColorStop(0, 'rgba(46, 213, 115, 0.30)');
    grad.addColorStop(0.6, 'rgba(46, 213, 115, 0.10)');
    grad.addColorStop(1, 'rgba(46, 213, 115, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(g.x, g.y, R, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(g.x, g.y); ctx.rotate(now / 2000);
    ctx.setLineDash([10, 12]);
    ctx.strokeStyle = 'rgba(46, 213, 115, 0.75)';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = 'rgba(46, 213, 115, 0.4)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(g.x - 10, g.y); ctx.lineTo(g.x + 10, g.y);
    ctx.moveTo(g.x, g.y - 10); ctx.lineTo(g.x, g.y + 10);
    ctx.stroke();
}

function drawTrail() {
    const tr = state.trail;
    if (tr.length < 2) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < tr.length; i++) {
        const a = (i / tr.length) * 0.28;
        ctx.strokeStyle = 'rgba(46, 213, 115, ' + a + ')';
        ctx.lineWidth = 1 + (i / tr.length) * 2.5;
        ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke();
    }
    ctx.restore();
}

function drawFixedCharges(now) {
    for (let i = 0; i < state.fixed.length; i++) {
        const c = state.fixed[i];
        const isPos = c.sign > 0;
        const rgb = isPos ? '255, 92, 108' : '77, 124, 255';
        const pulseFactor = 1 + c.pulse * 0.4;
        if (c.type === 'point') drawPointCharge(c, rgb, pulseFactor, now);
        else if (c.type === 'ring') drawRingCharge(c, rgb, pulseFactor, now);
        else if (c.type === 'disk') drawDiskCharge(c, rgb, pulseFactor, now);
        else if (c.type === 'line') drawLineCharge(c, rgb, pulseFactor, now);
    }
}

function drawPointCharge(c, rgb, pulseFactor, now) {
    const R = c.r * pulseFactor;
    ctx.save();
    ctx.setLineDash([5, 5]); ctx.lineDashOffset = -now / 80;
    ctx.strokeStyle = 'rgba(' + rgb + ', 0.50)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.shellR, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(c.x, c.y, c.shellR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + rgb + ', 0.05)'; ctx.fill();
    const g = ctx.createRadialGradient(c.x, c.y, R * 0.5, c.x, c.y, R * 2.8);
    g.addColorStop(0, 'rgba(' + rgb + ', ' + (0.28 + c.pulse * 0.30) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ', 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, R * 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(' + rgb + ')'; ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(c.x - R * 0.38, c.y); ctx.lineTo(c.x + R * 0.38, c.y);
    if (c.sign > 0) { ctx.moveTo(c.x, c.y - R * 0.38); ctx.lineTo(c.x, c.y + R * 0.38); }
    ctx.stroke();
}

function drawRingCharge(c, rgb, pulseFactor, now) {
    const R = c.R;
    const g = ctx.createRadialGradient(c.x, c.y, R * 0.7, c.x, c.y, R * 1.8);
    g.addColorStop(0, 'rgba(' + rgb + ', 0.12)');
    g.addColorStop(0.5, 'rgba(' + rgb + ', ' + (0.08 + c.pulse * 0.20) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ', 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, R * 1.8, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 5; i++) {
        const r = R - 6 + i * 3;
        ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${rgb}, ${0.25 + i * 0.12})`;
        ctx.lineWidth = 2.5; ctx.stroke();
    }
    const dots = 24;
    for (let i = 0; i < dots; i++) {
        const a = (i / dots) * Math.PI * 2 + now / 3000;
        const dx = c.x + R * Math.cos(a), dy = c.y + R * Math.sin(a);
        ctx.beginPath(); ctx.arc(dx, dy, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.5 + c.pulse * 0.4) + ')'; ctx.fill();
    }
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(' + rgb + ', 0.6)';
    ctx.fillText(c.sign > 0 ? '+' : '−', c.x, c.y);
    ctx.textBaseline = 'alphabetic';
}

function drawDiskCharge(c, rgb, pulseFactor, now) {
    const R = c.R;
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R);
    g.addColorStop(0, 'rgba(' + rgb + ', ' + (0.15 + c.pulse * 0.2) + ')');
    g.addColorStop(0.7, 'rgba(' + rgb + ', ' + (0.08 + c.pulse * 0.1) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ', 0.03)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.setLineDash([6, 6]); ctx.lineDashOffset = -now / 60;
    ctx.strokeStyle = 'rgba(' + rgb + ', 0.7)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    for (let i = 1; i <= 4; i++) {
        const r = R * i / 5;
        ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + rgb + ', ' + (0.06 + i * 0.03 + c.pulse * 0.1) + ')';
        ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(' + rgb + ', 0.5)';
    ctx.fillText(c.sign > 0 ? '+' : '−', c.x, c.y);
    ctx.textBaseline = 'alphabetic';
}

function drawLineCharge(c, rgb, pulseFactor, now) {
    const x = c.x;
    ctx.save();
    ctx.setLineDash([4, 8]); ctx.lineDashOffset = now / 100;
    for (let i = 0; i < 8; i++) {
        const y = (i / 8) * H;
        ctx.strokeStyle = 'rgba(' + rgb + ', 0.08)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
    const layers = [
        { width: 8, alpha: 0.12 }, { width: 5, alpha: 0.25 },
        { width: 3, alpha: 0.5 }, { width: 1.5, alpha: 0.9 },
    ];
    for (const layer of layers) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H);
        ctx.strokeStyle = 'rgba(' + rgb + ', ' + (layer.alpha + c.pulse * 0.2) + ')';
        ctx.lineWidth = layer.width; ctx.stroke();
    }
    const dots = 16;
    for (let i = 0; i < dots; i++) {
        const y = (i / dots) * H;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.4 + c.pulse * 0.4) + ')'; ctx.fill();
    }
}

function drawTestCharge(now) {
    const t = state.test;
    if (!t) return;
    const r = 46, g = 213, b = 115;
    const pulse = 1 + Math.sin(now / 200) * 0.08;
    const grad = ctx.createRadialGradient(t.x, t.y, t.r * 0.5, t.x, t.y, t.r * 3 * pulse);
    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.25)`);
    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 3 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.shadowColor = `rgb(${r}, ${g}, ${b})`;
    ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#0a0e14'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(t.x - 5, t.y); ctx.lineTo(t.x + 5, t.y);
    ctx.moveTo(t.x, t.y - 5); ctx.lineTo(t.x, t.y + 5);
    ctx.stroke();
}

function drawParticles() {
    for (const p of state.particles) {
        const a = p.life / p.maxLife;
        ctx.globalAlpha = a * 0.8;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawWinOverlay() {
    ctx.fillStyle = 'rgba(8, 10, 20, 0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2ed573';
    ctx.font = '700 32px system-ui, sans-serif';
    ctx.fillText('电荷已抵达目标', W / 2, H / 2 - 30);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.font = '400 17px system-ui, sans-serif';
    ctx.fillText('用时 ' + state.elapsed.toFixed(1) + ' 秒 · 翻转 ' + state.flipped + ' 次', W / 2, H / 2 + 10);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.font = '400 14px system-ui, sans-serif';
    ctx.fillText('点击屏幕 / 按 R 键  ·  继续', W / 2, H / 2 + 50);
}

function drawLostOverlay() {
    ctx.fillStyle = 'rgba(20, 8, 12, 0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4757';
    ctx.font = '700 32px system-ui, sans-serif';
    ctx.fillText('⏱ 时间到！', W / 2, H / 2 - 30);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.font = '400 16px system-ui, sans-serif';
    ctx.fillText('按 R 键重新开始', W / 2, H / 2 + 30);
}

// ============================================================
//  输入
// ============================================================
canvas.addEventListener('pointerdown', function (e) {
    if (!state.running) return;
    if (state.paused) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (state.phase === 'won') {
        if (performance.now() - state.winAt > 400) newGame();
        return;
    }
    if (state.phase === 'lost') {
        newGame();
        return;
    }

    for (let i = state.fixed.length - 1; i >= 0; i--) {
        const c = state.fixed[i];
        let hit = false;
        if (c.type === 'point') hit = dist(x, y, c.x, c.y) < c.shellR + 14;
        else if (c.type === 'ring') hit = Math.abs(dist(x, y, c.x, c.y) - c.R) < 22;
        else if (c.type === 'disk') hit = dist(x, y, c.x, c.y) < c.R + 14;
        else if (c.type === 'line') hit = Math.abs(x - c.x) < 26;
        if (hit) {
            c.sign *= -1;
            c.pulse = 1;
            state.flipped++;
            setFlipDisplay(state.flipped);
            sfxFlip(c.sign > 0);
            const col = c.sign > 0 ? '#ff5c6c' : '#4d7cff';
            const px = c.type === 'line' ? c.x : c.x;
            const py = c.type === 'line' ? y : c.y;
            spawnParticles(px, py, 8, col);
            return;
        }
    }

    if (state.test && dist(x, y, state.test.x, state.test.y) < state.test.r * 2.5) {
        state.test.vx = 0; state.test.vy = 0;
        spawnParticles(state.test.x, state.test.y, 6, '#2ed573');
        return;
    }
});

window.addEventListener('keydown', function (e) {
    if (e.code === 'KeyM') {
        if (state.running) {
            state.paused ? hidePause() : showPause();
        }
        return;
    }
    if (e.code === 'Space' && state.running && !state.paused) {
        e.preventDefault();
        showPause();
        return;
    }
    if (e.code === 'KeyR' && state.running) {
        newGame();
        return;
    }
    if (e.code === 'Escape' && state.running) {
        state.paused ? hidePause() : showPause();
        return;
    }
    if (!state.running && e.code.startsWith('Digit')) {
        const n = parseInt(e.code.replace('Digit', ''), 10);
        if (n >= 1 && n <= MODELS.length) {
            state.modelIndex = n - 1;
            document.querySelectorAll('#startModelGrid .start-item').forEach((el, i) => {
                el.classList.toggle('selected', i === state.modelIndex);
            });
        }
    }
});

// ============================================================
//  窗口尺寸变化
// ============================================================
let resizeTimer = 0;
window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
        resize();
        if (state.running && !state.paused) newGame();
    }, 200);
});

// ============================================================
//  主循环
// ============================================================
let lastTime = 0;
function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

// ============================================================
//  启动
// ============================================================
resize();
initStartScreen();
requestAnimationFrame(loop);

})();
</script>
