<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>2D静电场教学模拟器</title>
    <style>
        body {font-family:system-ui; padding:12px; max-width:1200px; margin:0 auto;}
        canvas {border:1px solid #333; background:#fff;}
        .panel {margin-bottom:8px;}
        button {padding:6px 12px; margin:3px; cursor:pointer;}
        .warn {color:red; font-weight:bold;}
    </style>
</head>
<body>
    <div class="warn">⚠ 提示：本模拟器为2D可视化模型，仅用于教学演示，非严格物理仿真</div>
    <div class="panel">
        <button id="btnPlus">添加正电荷(+q)</button>
        <button id="btnMinus">添加负电荷(-q)</button>
        <button id="btnClear">清空全部场源</button>
        <span id="tip">操作：先点按钮，再点击画布放置电荷</span>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div>
        <h3>闯关习题</h3>
        <div id="quiz">
            <p>1. 电场线起始于？A正电荷 B负电荷</p>
            <button onclick="check1('A')">A</button>
            <button onclick="check1('B')">B</button>
            <p id="ans1"></p>
        </div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let chargeList = [];
let mode = null; // plus / minus

document.getElementById('btnPlus').onclick = ()=>{mode='plus';document.getElementById('tip').textContent='当前：放置正电荷，点击画布';}
document.getElementById('btnMinus').onclick = ()=>{mode='minus';document.getElementById('tip').textContent='当前：放置负电荷，点击画布';}
document.getElementById('btnClear').onclick = ()=>{chargeList=[];render();}

// 画布点击：新建场源【修复核心】
canvas.onclick = function(e){
    if(!mode) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const q = mode==='plus' ? 1 : -1;
    chargeList.push({x,y,q});
    render();
}

// 绘制所有电荷
function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const c of chargeList){
        ctx.beginPath();
        ctx.arc(c.x,c.y,12,0,Math.PI*2);
        ctx.fillStyle = c.q>0 ? '#f44' : '#44f';
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font="16px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(c.q>0?"+":"−",c.x,c.y+5);
    }
}

// 答题
function check1(sel){
    document.getElementById('ans1').textContent = sel==='A'?"✅正确，电场线起于正电荷":"❌错误";
}
render();
</script>
</body>
</html>
