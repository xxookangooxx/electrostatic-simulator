<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>2D静电场教学模拟器</title>
    <style>
        body {font-family:system-ui; padding:12px; max-width:1200px; margin:0 auto;}
        canvas {border:1px solid #333; background:#fff;}
        .panel {margin-bottom:8px;}
        button {padding:6px 12px; margin:3px; cursor:pointer;}
        .warn {color:red; font-weight:bold;}
    </style>
</head>
<body>
    <div class="warn">⚠ 提示：本模拟器为2D可视化模型，仅用于教学演示，非严格物理仿真</div>
    <div class="panel">
        <button id="btnPlus">添加正电荷(+q)</button>
        <button id="btnMinus">添加负电荷(-q)</button>
        <button id="btnClear">清空全部场源</button>
        <span id="tip">操作：先点按钮，再点击画布放置电荷，自动绘制电场线</span>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div>
        <h3>闯关习题</h3>
        <div id="quiz">
            <p>1. 电场线起始于？A正电荷 B负电荷</p>
            <button onclick="check1('A')">A</button>
            <button onclick="check1('B')">B</button>
            <p id="ans1"></p>
        </div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let chargeList = [];
let mode = null;
const STEP = 2;       // 电场线步长
const MAX_STEP = 800; // 最大追踪步数
const THRESHOLD = 15; // 靠近电荷就停止

document.getElementById('btnPlus').onclick = ()=>{mode='plus';document.getElementById('tip').textContent='当前：放置正电荷，点击画布';}
document.getElementById('btnMinus').onclick = ()=>{mode='minus';document.getElementById('tip').textContent='当前：放置负电荷，点击画布';}
document.getElementById('btnClear').onclick = ()=>{chargeList=[];render();}

// 画布点击放置电荷
canvas.onclick = function(e){
    if(!mode) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const q = mode==='plus' ? 1 : -1;
    chargeList.push({x,y,q});
    render();
}

// 计算某点电场强度Ex Ey
function getField(px, py){
    let Ex=0, Ey=0;
    for(const c of chargeList){
        const dx = px - c.x;
        const dy = py - c.y;
        const r2 = dx*dx + dy*dy;
        const r = Math.sqrt(r2);
        if(r < THRESHOLD) return null;
        const E = c.q / r2;
        Ex += E * dx / r;
        Ey += E * dy / r;
    }
    return {Ex,Ey};
}

// 绘制单条电场线
function drawFieldLine(startX, startY, dir){
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    let x = startX, y = startY;
    for(let i=0;i<MAX_STEP;i++){
        const f = getField(x,y);
        if(!f) break;
        let nx, ny;
        if(dir>0){
            nx = x + f.Ex * STEP;
            ny = y + f.Ey * STEP;
        }else{
            nx = x - f.Ex * STEP;
            ny = y - f.Ey * STEP;
        }
        // 超出画布边界停止
        if(nx<0||nx>canvas.width||ny<0||ny>canvas.height) break;
        x=nx; y=ny;
        ctx.lineTo(x,y);
    }
    ctx.strokeStyle="#3377ff";
    ctx.lineWidth=1;
    ctx.stroke();
}

// 主渲染函数：电场线 + 电荷
function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 从正电荷表面发射多条电场线
    for(const c of chargeList){
        if(c.q > 0){
            const numLine = 16;
            for(let i=0;i<numLine;i++){
                const ang = (i / numLine) * Math.PI * 2;
                const sx = c.x + Math.cos(ang)*THRESHOLD;
                const sy = c.y + Math.sin(ang)*THRESHOLD;
                drawFieldLine(sx, sy, 1);
                drawFieldLine(sx, sy, -1);
            }
        }
    }
    // 绘制电荷圆圈
    for(const c of chargeList){
        ctx.beginPath();
        ctx.arc(c.x,c.y,12,0,Math.PI*2);
        ctx.fillStyle = c.q>0 ? '#f44' : '#44f';
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font="16px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(c.q>0?"+":"−",c.x,c.y+5);
    }
}

// 答题
function check1(sel){
    document.getElementById('ans1').textContent = sel==='A'?"✅正确，电场线起于正电荷":"❌错误";
}
render();
</script>
</body>
</html>
