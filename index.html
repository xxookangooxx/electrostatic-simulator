<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静电场小游戏 · 电势能探险</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1a2e, #1b2f44);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
        }

        .game-container {
            background: #1e3b4f;
            padding: 24px 28px 30px 28px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7), inset 0 0 8px #5e8a9c;
            border: 1px solid #84b7c9;
        }

        canvas {
            display: block;
            margin: 0 auto;
            width: 720px;
            height: 500px;
            border-radius: 24px;
            background: #101f2b;
            box-shadow: inset 0 0 40px #00000066, 0 10px 18px #00000080;
            cursor: crosshair;
            border: 2px solid #54889b;
        }

        .panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            color: #d4edff;
            text-shadow: 0 2px 4px black;
            font-weight: 500;
        }

        .stats {
            display: flex;
            gap: 32px;
            background: #0d232fcc;
            padding: 12px 26px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid #3e7e94;
            box-shadow: inset 0 0 6px #6ba3b9;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #a1c9dd;
        }

        .stat-value {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f2ffb0;
            text-shadow: 0 0 12px #aaffdd;
            min-width: 80px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .unit {
            font-size: 1rem;
            margin-left: 4px;
            color: #8bb3c7;
        }

        button {
            background: #2b586e;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #e6f7ff;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 0 #0d1e28, 0 6px 12px black;
            transition: all 0.07s ease;
            border: 1px solid #7db6cc;
            text-shadow: 0 2px 3px black;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #0d1e28, 0 6px 12px black;
        }

        button:hover {
            background: #357a91;
            box-shadow: 0 8px 0 #0d1e28, 0 8px 18px #99e6ff;
        }

        .hint {
            font-size: 0.95rem;
            color: #9dc7db;
            background: #16303eb0;
            padding: 8px 18px;
            border-radius: 30px;
            border-left: 6px solid #b3e4ff;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="720" height="500"></canvas>
        <div class="panel">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">⚡ 电势能</span>
                    <span id="energyValue" class="stat-value">0.0</span>
                    <span class="unit">J</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🎯 电荷量</span>
                    <span id="chargeValue" class="stat-value">1.0</span>
                    <span class="unit">C</span>
                </div>
            </div>
            <button id="resetButton">重新开始</button>
        </div>
        <div class="hint">
            🧲 鼠标移动小球 · 靠近正电荷电势能升高 · 释放鼠标重置位置
        </div>
    </div>

    <script>
        (function(){
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const energySpan = document.getElementById('energyValue');
            const chargeSpan = document.getElementById('chargeValue');

            // 固定电场参数 —— 模拟两个点电荷产生的静电场
            // 正电荷 (红色) : 位于 (200, 200) ，电荷量 Q1 = +2.0 C (为视觉和计算放大)
            // 负电荷 (蓝色) : 位于 (520, 320) ，电荷量 Q2 = -1.5 C
            const fixedCharges = [
                { x: 200, y: 200, q: 2.0, color: '#ff5e6b', label: '+2.0C' },
                { x: 520, y: 320, q: -1.5, color: '#4f9fff', label: '-1.5C' }
            ];

            // 可移动电荷 (小球) 属性
            let testCharge = {
                x: 360,
                y: 250,
                q: 1.0,          // 试探电荷电荷量 +1.0 C (正电荷)
                radius: 16,
                color: '#ffd966'
            };

            // 是否正在拖动（鼠标在小球内按下）
            let isDragging = false;
            // 鼠标是否在canvas内用于更新位置（仅在拖动时移动小球）
            let mouseInside = false;

            // 电势能常量 (库仑常数k, 为了游戏数值可视，调整k=1 让数值好看)
            const k = 1.0;   // 实际k=9e9，但为了游戏演示，我们缩小数值让电势能变化在合理范围

            // 计算点电荷之间的电势能 U = k * q1 * q2 / r
            // 小球与所有固定电荷之间的电势能之和
            function calculatePotentialEnergy(px, py) {
                let totalEnergy = 0;
                for (let fc of fixedCharges) {
                    const dx = px - fc.x;
                    const dy = py - fc.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    // 避免除以零（距离太近时限制最小值）
                    const safeDist = Math.max(dist, 25);  // 小于25像素按25算，防止无穷大
                    // 电势能 U = k * Q_fixed * q_test / r
                    totalEnergy += (k * fc.q * testCharge.q) / safeDist;
                }
                return totalEnergy;
            }

            // 更新显示的电势能
            function updateEnergyDisplay() {
                const energy = calculatePotentialEnergy(testCharge.x, testCharge.y);
                energySpan.textContent = energy.toFixed(2);
            }

            // 绘制场景
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 绘制电场线 / 等势线？为了视觉上更“电场”，绘制一些淡淡的径向渐变
                // 从两个固定电荷周围绘制光晕
                for (let fc of fixedCharges) {
                    const gradient = ctx.createRadialGradient(fc.x, fc.y, 5, fc.x, fc.y, 200);
                    gradient.addColorStop(0, fc.q > 0 ? 'rgba(255, 80, 100, 0.25)' : 'rgba(80, 150, 255, 0.25)');
                    gradient.addColorStop(0.7, 'rgba(30, 60, 90, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(fc.x, fc.y, 200, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 绘制潜在的等势线？ 简单绘制两个同心圆环示意
                ctx.save();
                ctx.globalAlpha = 0.15;
                ctx.strokeStyle = '#bbd9ff';
                ctx.lineWidth = 1.2;
                for (let fc of fixedCharges) {
                    for (let r = 50; r <= 200; r += 40) {
                        ctx.beginPath();
                        ctx.arc(fc.x, fc.y, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                ctx.restore();

                // 绘制固定电荷(点电荷)
                for (let fc of fixedCharges) {
                    // 光晕
                    ctx.shadowColor = fc.q > 0 ? '#ff8a9f' : '#6aafff';
                    ctx.shadowBlur = 22;
                    // 主球体
                    ctx.beginPath();
                    ctx.arc(fc.x, fc.y, 22, 0, Math.PI * 2);
                    ctx.fillStyle = fc.q > 0 ? '#e6394a' : '#2d7fe0';
                    ctx.fill();
                    // 内圈高光
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(fc.x-4, fc.y-4, 8, 0, Math.PI*2);
                    ctx.fillStyle = fc.q > 0 ? '#ffb3b8' : '#b0d4ff';
                    ctx.fill();
                    // 标签
                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 15px "Segoe UI", monospace';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#000000';
                    ctx.shadowBlur = 8;
                    ctx.fillText(fc.label, fc.x - 28, fc.y - 34);
                    // 重置阴影
                    ctx.shadowBlur = 0;
                }

                // 绘制试探电荷（可移动小球）
                // 首先画小球周围的“电场力”感 —— 动态颜色取决于电势能？可以画根据电势能的小光环
                const currentEnergy = calculatePotentialEnergy(testCharge.x, testCharge.y);
                const energyNorm = Math.min(Math.abs(currentEnergy) / 2.5, 1.0); // 用于颜色强度

                // 外光环（代表电势能）
                ctx.shadowColor = '#ffe484';
                ctx.shadowBlur = 30 + 30 * energyNorm;
                ctx.beginPath();
                ctx.arc(testCharge.x, testCharge.y, testCharge.radius + 4 + 4 * energyNorm, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 150, ${0.2 + 0.3 * energyNorm})`;
                ctx.fill();

                // 小球本体
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#f0e68c';
                ctx.beginPath();
                ctx.arc(testCharge.x, testCharge.y, testCharge.radius, 0, Math.PI * 2);
                // 根据电势能微调颜色 (正能量偏红，负能量偏蓝)
                const colorIntensity = Math.max(-1, Math.min(1, currentEnergy / 1.5));
                const r = Math.round(255);
                const g = Math.round(220 - 70 * colorIntensity);
                const b = Math.round(120 + 100 * (1 - Math.abs(colorIntensity)));
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.fill();
                // 内亮点
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(testCharge.x-5, testCharge.y-5, 7, 0, Math.PI*2);
                ctx.fillStyle = '#fff9e6';
                ctx.fill();

                // 绘制试探电荷的电荷量标记
                ctx.shadowBlur = 0;
                ctx.font = 'bold 15px "Segoe UI", sans-serif';
                ctx.fillStyle = '#1e1e1e';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.fillText('+1.0C', testCharge.x - 28, testCharge.y - 28);

                // 绘制坐标轴刻度(简单)
                ctx.shadowBlur = 0;
                ctx.font = '12px monospace';
                ctx.fillStyle = '#a0c0d0';
                ctx.fillText('⚡ 电场区域', 20, 35);
            }

            // 更新所有UI（电势能显示 + 重绘）
            function updateGame() {
                updateEnergyDisplay();
                draw();
            }

            // 重置小球到默认位置 (同时重置拖动状态)
            function resetGame() {
                testCharge.x = 360;
                testCharge.y = 250;
                isDragging = false;
                updateGame();
            }

            // 获取鼠标在canvas内的坐标
            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;   // canvas物理像素比
                const scaleY = canvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            // 检查点是否在试探电荷内
            function isPointInTestCharge(px, py) {
                const dx = px - testCharge.x;
                const dy = py - testCharge.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                return dist <= testCharge.radius + 8; // 增加一点拾取半径，更友好
            }

            // ---- 鼠标事件 ----
            function onMouseDown(e) {
                e.preventDefault();
                const { x, y } = getMousePos(e);
                if (isPointInTestCharge(x, y)) {
                    isDragging = true;
                    // 防止拖动时选中文本
                    canvas.style.cursor = 'grabbing';
                }
            }

            function onMouseMove(e) {
                e.preventDefault();
                const { x, y } = getMousePos(e);
                mouseInside = true;

                if (isDragging) {
                    // 边界限制，不要跑出画布太远，保留一点边缘
                    const margin = testCharge.radius + 2;
                    testCharge.x = Math.min(canvas.width - margin, Math.max(margin, x));
                    testCharge.y = Math.min(canvas.height - margin, Math.max(margin, y));
                    updateGame();
                } else {
                    // 可选：悬停效果，不拖动时改变光标
                    if (isPointInTestCharge(x, y)) {
                        canvas.style.cursor = 'grab';
                    } else {
                        canvas.style.cursor = 'crosshair';
                    }
                }
            }

            function onMouseUp(e) {
                e.preventDefault();
                if (isDragging) {
                    isDragging = false;
                    canvas.style.cursor = 'grab';
                    // 不重置位置，只停止拖动；但可更新
                    updateGame();
                }
            }

            function onMouseLeave(e) {
                // 如果鼠标离开画布，停止拖动（防止卡住）
                if (isDragging) {
                    isDragging = false;
                    canvas.style.cursor = 'crosshair';
                }
                mouseInside = false;
            }

            // 点击重置按钮
            document.getElementById('resetButton').addEventListener('click', resetGame);

            // 初始化时计算电势能并绘制
            updateGame();

            // 注册事件监听
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseLeave);
            // 防止在canvas外松开鼠标导致拖动状态残留
            window.addEventListener('mouseup', onMouseUp);

            // 可选：显示初始电荷量
            chargeSpan.textContent = testCharge.q.toFixed(1);

            // 额外展示：在电荷量旁边加个固定电荷总量提示？（不做，但电荷量就显示试探电荷）
            // 对于试探电荷的q固定为1.0C，也可以改成滑块，但游戏核心是移动。

            // 增加触摸支持（简单移动端适配）
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                });
                canvas.dispatchEvent(mouseEvent);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                });
                canvas.dispatchEvent(mouseEvent);
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                const mouseEvent = new MouseEvent('mouseup', {});
                canvas.dispatchEvent(mouseEvent);
            }, { passive: false });

            // 触摸取消
            canvas.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (isDragging) {
                    isDragging = false;
                    canvas.style.cursor = 'crosshair';
                }
            }, { passive: false });

        })();
    </script>
</body>
</html>
