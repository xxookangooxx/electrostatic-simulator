<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>静电场 · 电荷引导大师</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #0a0e14;
            overflow: hidden;
            font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game { display: block; width: 100%; height: 100%; touch-action: none; }
        #toast {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 30, 45, 0.94);
            color: #a8d8ff; padding: 10px 24px;
            border-radius: 30px; font-size: 14px;
            border: 1px solid #3d7186;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 12px rgba(100,180,255,0.2);
            opacity: 0; transition: all 0.35s ease;
            pointer-events: none; z-index: 10;
            letter-spacing: 0.3px;
            font-weight: 600;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { border-color: #2ed573; color: #b0ffc8; box-shadow: 0 0 18px rgba(46,213,115,0.4); }
        #toast.warn { border-color: #ffa502; color: #ffe0a0; box-shadow: 0 0 18px rgba(255,165,2,0.4); }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="toast"></div>

<script>
(function () {
'use strict';

// ============================================================
//  基础工具
// ============================================================
const rnd   = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist  = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

// ============================================================
//  Toast 提示
// ============================================================
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg, duration = 1800, type = '') {
    toastEl.textContent = msg;
    toastEl.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = ''; }, duration);
}

// ============================================================
//  音效
// ============================================================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
    }
}
function playTone(freq, dur, type = 'sine', vol = 0.06) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* ignore */ }
}
function sfxFlip(pos) { playTone(pos ? 700 : 420, 0.12, 'triangle', 0.06); }
function sfxCollect() { playTone(880, 0.09, 'sine', 0.07); setTimeout(() => playTone(1320, 0.12, 'sine', 0.05), 55); }
function sfxWin() { playTone(523, 0.14, 'sine', 0.08); setTimeout(() => playTone(659, 0.14), 110); setTimeout(() => playTone(784, 0.28), 220); }
function sfxEvent() { playTone(300, 0.2, 'sawtooth', 0.04); }
function sfxBad() { playTone(180, 0.25, 'sawtooth', 0.07); }

// ============================================================
//  画布初始化
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ============================================================
//  物理参数
// ============================================================
const SOFT       = 34;
const Q_FIXED    = 1.8e7;
const MASS       = 0.055;
const DRAG       = 0.52;
const MAX_SPEED  = 380;
const FAR_BOOST  = 0.008;
const WALL_BOUNCE = 0.45;
const SHELL_BOUNCE = 0.35;

// ============================================================
//  游戏状态
// ============================================================
const state = {
    test:    null,
    fixed:   [],
    goal:    null,
    flipped: 0,
    elapsed: 0,
    phase:   'playing',
    trail:   [],
    winAt:   0,
    modelIndex: 0,
    particles: [],
    collectibles: [],
    dragging: null,
    mouseX: 0, mouseY: 0,
    mouseInCanvas: false,
    showFieldArrows: true,
    showHeatmap: false,
    hoverTarget: null,
    // 随机事件系统
    eventTimer: 0,
    eventInterval: 12,     // 每 12 秒触发一次随机事件
    activeEvents: [],
    // 关卡目标
    goalParticles: 3,      // 需要收集的粒子数
    goalsCompleted: 0,     // 已完成关卡数
    // 关卡难度提升
    level: 1,
};

// ============================================================
//  随机事件定义
// ============================================================
const RANDOM_EVENTS = [
    {
        id: 'charge_flip',
        name: '⚡ 电荷紊乱',
        desc: '所有固定电荷极性随机翻转！',
        duration: 0,   // 瞬时
        apply: () => {
            for (const c of state.fixed) {
                if (Math.random() < 0.6) {
                    c.sign *= -1;
                    c.pulse = 1;
                }
            }
            sfxEvent();
            showToast('⚡ 电荷紊乱！极性随机翻转', 2000, 'warn');
        }
    },
    {
        id: 'gravity',
        name: '🌍 引力场',
        desc: '下方出现额外引力',
        duration: 8,
        apply: () => {
            showToast('🌍 引力场出现！小球向下加速', 2000, 'warn');
        },
        tick: (dt) => {
            if (state.test) {
                state.test.vy += 180 * dt;
            }
        }
    },
    {
        id: 'wind',
        name: '💨 电场风',
        desc: '横向电场风扰动',
        duration: 8,
        apply: () => {
            showToast('💨 电场风来袭！横向扰动', 2000, 'warn');
        },
        tick: (dt) => {
            if (state.test) {
                state.test.vx += Math.sin(performance.now() / 300) * 120 * dt;
            }
        }
    },
    {
        id: 'slow',
        name: '🐌 阻尼增强',
        desc: '速度暂时降低',
        duration: 6,
        apply: () => {
            showToast('🐌 阻尼增强！移动变慢', 2000, 'warn');
        },
        tick: (dt) => {
            if (state.test) {
                state.test.vx *= 0.96;
                state.test.vy *= 0.96;
            }
        }
    },
    {
        id: 'boost',
        name: '🚀 电场加速',
        desc: '获得额外速度',
        duration: 0,
        apply: () => {
            if (state.test) {
                const a = rnd(0, Math.PI * 2);
                state.test.vx += Math.cos(a) * 250;
                state.test.vy += Math.sin(a) * 250;
            }
            sfxEvent();
            showToast('🚀 电场加速！', 1500, 'success');
        }
    },
    {
        id: 'new_particle',
        name: '✨ 新粒子',
        desc: '场上出现额外收集粒子',
        duration: 0,
        apply: () => {
            for (let attempt = 0; attempt < 100; attempt++) {
                const x = rnd(W * 0.25, W * 0.75);
                const y = rnd(60, H - 60);
                let ok = true;
                for (const c of state.fixed) {
                    if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + 30) { ok = false; break; }
                    if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < 30) { ok = false; break; }
                    if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + 30) { ok = false; break; }
                    if (c.type === 'line' && Math.abs(x - c.x) < 30) { ok = false; break; }
                }
                if (ok) {
                    state.collectibles.push({
                        x, y, r: 8, collected: false, pulse: 0,
                        hue: rnd(0, 360),
                    });
                    break;
                }
            }
            sfxEvent();
            showToast('✨ 新粒子出现！', 1500, 'success');
        }
    },
    {
        id: 'shrink',
        name: '🔻 目标收缩',
        desc: '目标区域暂时缩小',
        duration: 7,
        apply: () => {
            if (state.goal) {
                state.goal.shrink = 0.55;
            }
            showToast('🔻 目标区域收缩！', 2000, 'warn');
        },
        tick: (dt) => {
            if (state.goal && state.goal.shrink !== undefined) {
                state.goal.shrink = Math.min(1, state.goal.shrink + dt * 0.08);
                if (state.goal.shrink >= 0.99) {
                    delete state.goal.shrink;
                }
            }
        },
        cleanup: () => {
            if (state.goal) delete state.goal.shrink;
        }
    },
    {
        id: 'teleport',
        name: '🌀 随机传送',
        desc: '小球被随机传送',
        duration: 0,
        apply: () => {
            if (state.test) {
                for (let attempt = 0; attempt < 200; attempt++) {
                    const x = rnd(50, W - 50);
                    const y = rnd(50, H - 50);
                    let ok = true;
                    for (const c of state.fixed) {
                        if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + state.test.r + 10) { ok = false; break; }
                        if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < state.test.r + 15) { ok = false; break; }
                        if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + state.test.r + 10) { ok = false; break; }
                        if (c.type === 'line' && Math.abs(x - c.x) < state.test.r + 20) { ok = false; break; }
                    }
                    if (ok) {
                        state.test.x = x;
                        state.test.y = y;
                        state.test.vx = 0;
                        state.test.vy = 0;
                        break;
                    }
                }
            }
            sfxEvent();
            showToast('🌀 小球被传送到了随机位置！', 1800, 'warn');
        }
    },
];

// ============================================================
//  模型定义
// ============================================================
const MODELS = [
    {
        name: '双电荷',
        desc: '正负点电荷 · 经典偶极子',
        elements: () => {
            const S = Math.min(W, H);
            const margin = Math.max(70, S * 0.20);
            return [
                { type: 'point', x: margin, y: H * 0.30, sign: 1 },
                { type: 'point', x: W - margin, y: H * 0.70, sign: -1 },
            ];
        },
    },
    {
        name: '四极子',
        desc: '两对正负电荷交替排列',
        elements: () => {
            const S = Math.min(W, H);
            const cx = W / 2, cy = H / 2;
            const d = S * 0.30;
            return [
                { type: 'point', x: cx - d, y: cy - d, sign: 1 },
                { type: 'point', x: cx + d, y: cy - d, sign: -1 },
                { type: 'point', x: cx - d, y: cy + d, sign: -1 },
                { type: 'point', x: cx + d, y: cy + d, sign: 1 },
            ];
        },
    },
    {
        name: '圆环',
        desc: '均匀带电圆环 · 中轴线电场',
        elements: () => {
            const S = Math.min(W, H);
            const R = S * 0.28;
            return [
                { type: 'ring', x: W / 2, y: H / 2, R: R, sign: 1, charge: 2.5 },
            ];
        },
    },
    {
        name: '圆盘',
        desc: '均匀带电圆盘 · 轴线电场',
        elements: () => {
            const S = Math.min(W, H);
            const R = S * 0.30;
            return [
                { type: 'disk', x: W / 2, y: H / 2, R: R, sign: 1, charge: 3.0 },
            ];
        },
    },
    {
        name: '无限长直线',
        desc: '均匀带电直线 · 径向电场',
        elements: () => {
            return [
                { type: 'line', x: W / 2, y1: 0, y2: H, sign: 1, charge: 2.0 },
            ];
        },
    },
    {
        name: '平行板',
        desc: '上下极板模拟匀强电场',
        elements: () => {
            const S = Math.min(W, H);
            const margin = Math.max(60, S * 0.16);
            const n = 5;
            const xs = [];
            for (let i = 0; i < n; i++) {
                xs.push(margin + (i / (n - 1)) * (W - 2 * margin));
            }
            const topY = margin;
            const botY = H - margin;
            const charges = [];
            xs.forEach(x => charges.push({ type: 'point', x, y: topY, sign: 1 }));
            xs.forEach(x => charges.push({ type: 'point', x, y: botY, sign: -1 }));
            return charges;
        },
    },
    {
        name: '六角环',
        desc: '正负电荷交替在六边形顶点',
        elements: () => {
            const S = Math.min(W, H);
            const cx = W / 2, cy = H / 2;
            const R = S * 0.34;
            const charges = [];
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
                charges.push({
                    type: 'point',
                    x: cx + R * Math.cos(a),
                    y: cy + R * Math.sin(a),
                    sign: i % 2 === 0 ? 1 : -1,
                });
            }
            return charges;
        },
    },
    {
        name: '偶极子',
        desc: '正负电荷靠得很近',
        elements: () => {
            const S = Math.min(W, H);
            const cx = W / 2, cy = H / 2;
            const d = S * 0.14;
            return [
                { type: 'point', x: cx - d, y: cy - d * 0.6, sign: 1 },
                { type: 'point', x: cx + d, y: cy + d * 0.6, sign: -1 },
            ];
        },
    },
    {
        name: '随机狂野',
        desc: '完全随机 · 每个电荷都随机',
        elements: () => {
            const S = Math.min(W, H);
            const count = rndInt(3, 6);
            const charges = [];
            const placed = [];
            for (let i = 0; i < count; i++) {
                let pos = null;
                for (let attempt = 0; attempt < 100; attempt++) {
                    const x = rnd(60, W - 60);
                    const y = rnd(60, H - 60);
                    let ok = true;
                    for (const p of placed) {
                        if (dist(x, y, p.x, p.y) < S * 0.18) { ok = false; break; }
                    }
                    if (ok) { pos = { x, y }; break; }
                }
                if (!pos) pos = { x: rnd(60, W - 60), y: rnd(60, H - 60) };
                placed.push(pos);
                charges.push({
                    type: Math.random() < 0.75 ? 'point' : (Math.random() < 0.5 ? 'ring' : 'disk'),
                    x: pos.x, y: pos.y,
                    sign: Math.random() < 0.5 ? 1 : -1,
                    R: rnd(S * 0.12, S * 0.22),
                    charge: rnd(1.5, 3.0),
                });
            }
            return charges;
        },
    },
];

// ============================================================
//  放置固定带电体
// ============================================================
function placeFixedCharges() {
    const S = Math.min(W, H);
    const fixedR = clamp(S * 0.028, 14, 24);
    const shellR = fixedR * 1.38;

    const raw = MODELS[state.modelIndex].elements();
    return raw.map(c => {
        if (c.type === 'point') {
            return {
                type: 'point',
                x: c.x, y: c.y,
                r: fixedR,
                shellR: shellR,
                sign: c.sign,
                pulse: 0,
            };
        } else if (c.type === 'ring') {
            return {
                type: 'ring',
                x: c.x, y: c.y,
                R: c.R,
                sign: c.sign,
                charge: c.charge || 2.0,
                pulse: 0,
                shellR: 0,
            };
        } else if (c.type === 'disk') {
            return {
                type: 'disk',
                x: c.x, y: c.y,
                R: c.R,
                sign: c.sign,
                charge: c.charge || 3.0,
                pulse: 0,
                shellR: 0,
            };
        } else if (c.type === 'line') {
            return {
                type: 'line',
                x: c.x,
                y1: c.y1 !== undefined ? c.y1 : 0,
                y2: c.y2 !== undefined ? c.y2 : H,
                sign: c.sign,
                charge: c.charge || 2.0,
                pulse: 0,
                shellR: 0,
            };
        }
        return c;
    });
}

// ============================================================
//  开一局新游戏
// ============================================================
function newGame() {
    state.flipped = 0;
    state.elapsed = 0;
    state.phase   = 'playing';
    state.trail   = [];
    state.particles = [];
    state.dragging = null;
    state.hoverTarget = null;
    state.eventTimer = 0;
    state.activeEvents = [];
    state.goalParticles = 3;
    state.goalsCompleted = 0;

    const S = Math.min(W, H);
    const margin = Math.max(55, S * 0.13);

    state.fixed = placeFixedCharges();

    const testR = clamp(S * 0.022, 11, 18);
    let testPos = null;
    for (let attempt = 0; attempt < 500; attempt++) {
        const x = rnd(margin, W * 0.30);
        const y = rnd(margin, H - margin);
        let ok = true;
        for (const c of state.fixed) {
            if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + testR + 20) { ok = false; break; }
            if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < testR + 20) { ok = false; break; }
            if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + testR + 20) { ok = false; break; }
            if (c.type === 'line' && Math.abs(x - c.x) < testR + 30) { ok = false; break; }
        }
        if (ok) { testPos = { x, y }; break; }
    }
    if (!testPos) testPos = { x: W * 0.15, y: H / 2 };
    state.test = { x: testPos.x, y: testPos.y, vx: 0, vy: 0, r: testR };

    const goalR = clamp(S * 0.070, 36, 55);
    let goalPos = null;
    for (let attempt = 0; attempt < 500; attempt++) {
        const x = rnd(W * 0.65, W - margin);
        const y = rnd(margin, H - margin);
        if (dist(x, y, state.test.x, state.test.y) < goalR * 2.0) continue;
        let ok = true;
        for (const c of state.fixed) {
            if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + goalR + 24) { ok = false; break; }
            if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < goalR + 24) { ok = false; break; }
            if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + goalR + 24) { ok = false; break; }
            if (c.type === 'line' && Math.abs(x - c.x) < goalR + 30) { ok = false; break; }
        }
        if (ok) { goalPos = { x, y }; break; }
    }
    if (!goalPos) goalPos = { x: W * 0.80, y: H * 0.70 };
    state.goal = { x: goalPos.x, y: goalPos.y, r: goalR };

    state.collectibles = [];
    for (let i = 0; i < state.goalParticles; i++) {
        for (let attempt = 0; attempt < 300; attempt++) {
            const x = rnd(W * 0.30, W * 0.70);
            const y = rnd(margin, H - margin);
            if (dist(x, y, state.test.x, state.test.y) < 80) continue;
            if (dist(x, y, state.goal.x, state.goal.y) < 80) continue;
            let ok = true;
            for (const c of state.fixed) {
                if (c.type === 'point' && dist(x, y, c.x, c.y) < c.shellR + 30) { ok = false; break; }
                if (c.type === 'ring' && Math.abs(dist(x, y, c.x, c.y) - c.R) < 30) { ok = false; break; }
                if (c.type === 'disk' && dist(x, y, c.x, c.y) < c.R + 30) { ok = false; break; }
                if (c.type === 'line' && Math.abs(x - c.x) < 30) { ok = false; break; }
            }
            if (ok) {
                state.collectibles.push({
                    x, y, r: 8, collected: false, pulse: 0,
                    hue: i * 120,
                });
                break;
            }
        }
    }
}

// ============================================================
//  电场计算
// ============================================================
function fieldRing(t, c) {
    const dx = t.x - c.x, dy = t.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { fx: 0, fy: 0 };
    const nx = dx / d, ny = dy / d;
    const q = c.sign * c.charge * Q_FIXED;
    if (d > c.R * 2.5) {
        const d2 = d * d + SOFT * SOFT;
        const r = Math.sqrt(d2);
        const k = q / (d2 * r) * (1 + r * FAR_BOOST);
        return { fx: k * dx, fy: k * dy };
    }
    const d2 = d * d + SOFT * SOFT;
    const r = Math.sqrt(d2);
    const k = q / (d2 * r) * (1 + r * FAR_BOOST);
    const radialFactor = d > c.R ? 1.0 : d / c.R;
    const ringPenalty = Math.exp(-Math.abs(d - c.R) / (c.R * 0.3)) * 0.8;
    return {
        fx: k * nx * (radialFactor + ringPenalty),
        fy: k * ny * (radialFactor + ringPenalty),
    };
}

function fieldDisk(t, c) {
    const dx = t.x - c.x, dy = t.y - c.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { fx: 0, fy: 0 };
    const nx = dx / d, ny = dy / d;
    const q = c.sign * c.charge * Q_FIXED;
    if (d > c.R * 3) {
        const d2 = d * d + SOFT * SOFT;
        const r = Math.sqrt(d2);
        const k = q / (d2 * r) * (1 + r * FAR_BOOST);

    }
    const d2 = d * d + SOFT * SOFT;
    const r = Math.sqrt(d2);
    const k = q / (d2 * r) * (1 + r * FAR_BOOST);
    const factor = d > c.R ? 1.0 : -d / c.R * 0.6;
    const diskPenalty = Math.exp(-Math.abs(d - c.R) / (c.R * 0.25)) * 1.0;

}

function fieldLine(t, c) {
    const dx = t.x - c.x;
    const d = Math.abs(dx);
    if (d < 1) return { fx: 0, fy: 0 };
    const nx = dx / d;
    const q = c.sign * c.charge * Q_FIXED;
    const k = q / (d * (d + SOFT)) * (1 + d * FAR_BOOST);
    return { fx: k * nx, fy: 0 };
}

function fieldAt(x, y) {
    let fx = 0, fy = 0;
    for (const c of state.fixed) {
        if (c.type === 'point') {
            const q = c.sign * Q_FIXED;
            const dx = x - c.x, dy = y - c.y;
            const d2 = dx * dx + dy * dy + SOFT * SOFT;
            const r = Math.sqrt(d2);
            const k = q / (d2 * r) * (1 + r * FAR_BOOST);
            fx += k * dx;
            fy += k * dy;
        } else if (c.type === 'ring') {
            const f = fieldRing({ x, y }, c);
            fx += f.fx; fy += f.fy;
        } else if (c.type === 'disk') {
            const f = fieldDisk({ x, y }, c);
            fx += f.fx; fy += f.fy;
        } else if (c.type === 'line') {
            const f = fieldLine({ x, y }, c);
            fx += f.fx; fy += f.fy;
        }
    }
    return { fx, fy };
}

function calcPotentialEnergy() {
    const t = state.test;
    if (!t) return 0;
    let U = 0;
    for (const c of state.fixed) {
        if (c.type === 'point') {
            const d = Math.max(dist(t.x, t.y, c.x, c.y), SOFT);
            U += (c.sign * Q_FIXED * 1.0) / d;
        } else if (c.type === 'ring') {
            const d = Math.max(dist(t.x, t.y, c.x, c.y), SOFT);
            U += (c.sign * c.charge * Q_FIXED * 1.0) / d;
        } else if (c.type === 'disk') {
            const d = Math.max(dist(t.x, t.y, c.x, c.y), SOFT);
            U += (c.sign * c.charge * Q_FIXED * 1.0) / d;
        } else if (c.type === 'line') {
            const d = Math.max(Math.abs(t.x - c.x), SOFT);
            U += -(c.sign * c.charge * Q_FIXED * 1.0) * Math.log(d / 100);
        }
    }
    return U;
}
