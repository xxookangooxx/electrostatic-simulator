<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静电场模拟器｜2D教学模拟｜答题解锁关卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0f1218;color:#e8edf2;padding:12px}
#warnBar{
    width:100%;
    background:#3b2800;
    color:#ffdd77;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:14px;
    border:1px solid #886622;
}
#container{display:flex;gap:14px;max-width:1480px;margin:0 auto;flex-wrap:wrap}
#panel{width:260px;background:#1b222c;padding:14px;border-radius:10px;border:1px solid #333a46}
#canvasWrap{flex:1;position:relative}
canvas{border:1px solid #444;background:#050510;border-radius:8px;touch-action:none}
button{padding:7px 10px;margin:4px 2px;border:none;border-radius:6px;cursor:pointer;background:#384252;color:#eee;font-size:14px}
button.active{background:#4285f4;color:#fff}
button:disabled{background:#222831;color:#666;cursor:not-allowed}
.ctrl{margin:12px 0;border-top:1px solid #333a46;padding-top:10px}
.ctrl:first-of-type{border-top:none}
label{display:block;margin-top:8px;font-size:14px;color:#cdd5e0}
input[type=range]{width:100%;margin-top:4px}
.levelBtn{width:46%}
h3{margin-bottom:10px;color:#8cf;font-size:18px}
#tip{color:#ffdd66;font-size:14px;margin:8px 0;padding:6px;background:#2c2820;border-radius:6px}
#eReadout{
    position:absolute;top:12px;right:12px;
    background:rgba(10,14,22,0.82);
    border:1px solid #394b66;
    padding:10px 12px;border-radius:8px;
    color:#aee8ff;font-size:13px;
    min-width:170px;
}
.legend-item{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.legend-color{width:14px;height:14px;border-radius:3px}
.modal{
    display:none;
    position:fixed;
    left:0;top:0;
    width:100vw;height:100vh;
    background:rgba(0,0,0,0.65);
    z-index:100;
    align-items:center;justify-content:center;
}
.modal-box{
    width:min(520px,90vw);
    background:#1b222c;border:1px solid #445;
    padding:20px;border-radius:10px;color:#e8edf2
}
.modal-box h4{color:#8cf;margin-bottom:14px;font-size:17px}
.opt{
    padding:12px;margin:7px 0;background:#2c3442;
    border-radius:6px;cursor:pointer;
}
.opt:hover{background:#384252}
#ansMsg{margin:12px 0;font-weight:bold;font-size:15px}
.modalBtns{margin-top:16px;display:flex;gap:10px;justify-content:flex-end}
#particleCanvas{
    position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;
}
</style>
</head>
<body>
<div id="warnBar">⚠️ 本模拟器为<strong>2D平面投影</strong>，场强衰减、电势公式针对2D可视化适配，仅用于定性教学参考，数值不等于真实三维空间静电场。</div>
<div id="container">
<div id="panel">
<h3>静电场模拟器</h3>
<div id="tip">关卡：<span id="levelName">关卡1【初识点电荷】</span></div>

<div class="ctrl">
<p>选择场源类型</p>
<button id="btPoint" class="active">点电荷</button>
<button id="btLine" disabled>无限长直线</button>
<button id="btRing" disabled>带电圆环</button>
<button id="btDisk" disabled>带电圆盘</button>
</div>

<div class="ctrl">
<label>电荷正负：<input type="checkbox" id="chkNeg">负电荷</label>
<label>电荷量 <span id="valQ">1.0</span></label>
<input type="range" id="rQ" min="0.2" max="2.5" step="0.1" value="1">
</div>

<div class="ctrl">
<label>电场线总数 <span id="valD">36</span></label>
<input type="range" id="rD" min="8" max="80" step="4" value="36">
<label><input type="checkbox" id="chkEqui">显示等势线</label>
</div>

<div class="ctrl">
<p>关卡选择</p>
<button class="levelBtn" data-lv="1">关卡1</button>
<button class="levelBtn" data-lv="2" disabled>关卡2</button>
<button class="levelBtn" data-lv="3" disabled>关卡3</button>
<button class="levelBtn" data-lv="4" disabled>关卡4</button>
</div>

<div class="ctrl">
<button id="btClear">清空画布</button>
<button id="btQuiz">本关答题</button>
</div>

<div class="ctrl">
<p style="margin-bottom:8px;color:#9cf">图例</p>
<div class="legend-item">
    <span class="legend-color" style="background:#f44"></span>
    <span>正场源</span>
</div>
<div class="legend-item">
    <span class="legend-color" style="background:#44f"></span>
    <span>负场源</span>
</div>
<div style="margin-top:8px;font-size:12px;color:#aaa">
点击画布放置场源<br>鼠标右键 / 触屏长按删除场源
</div>
</div>
</div>

<div id="canvasWrap">
    <canvas id="cv" width="920" height="640"></canvas>
    <canvas id="particleCanvas" width="920" height="640"></canvas>
    <div id="eReadout">
        <div><b>电场读数（鼠标位置）</b></div>
        <div>Ex: <span id="ExVal">0.000</span></div>
        <div>Ey: <span id="EyVal">0.000</span></div>
        <div>|E|: <span id="EMagVal">0.000</span></div>
    </div>
</div>
</div>

<div class="modal" id="quizModal">
    <div class="modal-box">
        <h4 id="qTitle">题目</h4>
        <div id="qContent"></div>
        <div id="ansMsg"></div>
        <div class="modalBtns">
            <button id="closeModal">关闭</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
// 离屏缓存画布
const offscreen = document.createElement('canvas');
offscreen.width = canvas.width;
offscreen.height = canvas.height;
const offCtx = offscreen.getContext('2d');
//粒子画布
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
pCanvas.width = canvas.width;
pCanvas.height = canvas.height;

const W = canvas.width, H = canvas.height;
const $Ex = document.getElementById('ExVal');
const $Ey = document.getElementById('EyVal');
const $EMag = document.getElementById('EMagVal');
const modal = document.getElementById('quizModal');
const qTitle = document.getElementById('qTitle');
const qContent = document.getElementById('qContent');
const ansMsg = document.getElementById('ansMsg');

const levelQuiz = [
    {
        name:"关卡1【初识点电荷】",
        question: "两个等量异种点电荷，中间位置的电场方向为？",
        options: [
            {txt:"由正电荷指向负电荷",correct:true},
            {txt:"由负电荷指向正电荷",correct:false},
            {txt:"场强为0，无方向",correct:false},
            {txt:"垂直连线方向",correct:false}
        ]
    },
    {
        name:"关卡2【无限长带电直线】",
        question:"无限长均匀带电直线的场强大小与到直线距离ρ是什么关系？",
        options: [
            {txt:"E∝1/ρ²",correct:false},
            {txt:"E∝1/ρ",correct:true},
            {txt:"E与ρ无关",correct:false},
            {txt:"E∝ρ",correct:false}
        ]
    },
    {
        name:"关卡3【带电圆环】",
        question:"平面带电圆环圆心处电场强度是？",
        options: [
            {txt:"最大值",correct:false},
            {txt:"0",correct:true},
            {txt:"与圆环半径成正比",correct:false},
            {txt:"不为0，方向沿轴线向外",correct:false}
        ]
    },
    {
        name:"关卡4【带电圆盘】",
        question:"无限大均匀带电平面，空间电场为？",
        options: [
            {txt:"随距离平方衰减",correct:false},
            {txt:"匀强电场",correct:true},
            {txt:"与距离成正比",correct:false},
            {txt:"场强恒为0",correct:false}
        ]
    }
];

let state = {
    chargeType:'point',
    isNegative:false,
    Q:1.0,
    density:36,
    showEqui:false,
    sources:[],
    level:1,
    unlock: [true,false,false,false],
    mouseX:0,mouseY:0,
    dirty:true,
    dashOffset:0
};

//粒子系统
let particles = [];
function spawnCelebrateParticles(){
    for(let i=0;i<60;i++){
        particles.push({
            x: W/2,
            y:H/2,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6-2,
            life:1,
            color:`hsl(${Math.random()*360},85%,70%)`
        })
    }
}
function updateParticles(dt){
    pCtx.clearRect(0,0,W,H);
    for(let i=particles.length-1;i>=0;i--){
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy +=0.12;
        pt.life -= dt*0.8;
        if(pt.life <=0){particles.splice(i,1);continue;}
        pCtx.globalAlpha = pt.life;
        pCtx.fillStyle = pt.color;
        pCtx.beginPath();
        pCtx.arc(pt.x,pt.y,4,0,Math.PI*2);
        pCtx.fill();
    }
    pCtx.globalAlpha=1;
}

const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const btPoint = $('#btPoint');
const btLine = $('#btLine');
const btRing = $('#btRing');
const btDisk = $('#btDisk');

$('#btPoint').onclick=()=>setType('point');
$('#btLine').onclick=()=>setType('line');
$('#btRing').onclick=()=>setType('ring');
$('#btDisk').onclick=()=>setType('disk');
function setType(t){
    state.chargeType=t;
    [btPoint,btLine,btRing,btDisk].forEach(b=>b.classList.remove('active'));
    if(t==='point') btPoint.classList.add('active');
    if(t==='line') btLine.classList.add('active');
    if(t==='ring') btRing.classList.add('active');
    if(t==='disk') btDisk.classList.add('active');
    state.dirty=true;
}

$('#chkNeg').onchange=e=>{state.isNegative=e.target.checked;state.dirty=true};
$('#rQ').oninput=e=>{state.Q=+e.target.value;$('#valQ').textContent=state.Q.toFixed(1);state.dirty=true};
$('#rD').oninput=e=>{state.density=+e.target.value;$('#valD').textContent=state.density;state.dirty=true};
$('#chkEqui').onchange=e=>{state.showEqui=e.target.checked;state.dirty=true};
$('#btClear').onclick=()=>{state.sources=[];state.dirty=true};
$('#btQuiz').onclick=openQuiz;
$('#closeModal').onclick=()=>modal.style.display='none';

$$('.levelBtn').forEach(b=>{
    b.onclick=()=>{
        const lv = +b.dataset.lv;
        if(!state.unlock[lv-1]) return;
        state.level = lv;
        updateUIByLevel();
    }
})

function updateUIByLevel(){
    const lv = state.level;
    $('#levelName').textContent = levelQuiz[lv-1].name;
    btPoint.disabled=false;
    btLine.disabled = lv<2;
    btRing.disabled = lv<3;
    btDisk.disabled = lv<4;
    $$('.levelBtn').forEach(b=>{
        const l = +b.dataset.lv;
        b.disabled = !state.unlock[l-1];
    })
}

function openQuiz(){
    const idx = state.level -1;
    const quiz = levelQuiz[idx];
    qTitle.innerText = quiz.name + " 选择题";
    ansMsg.innerText = "";
    let html = "";
    html += `<div style="margin-bottom:12px">${quiz.question}</div>`;
    quiz.options.forEach((opt,i)=>{
        html += `<div class="opt" data-correct="${opt.correct}">${String.fromCharCode(65+i)}. ${opt.txt}</div>`
    })
    qContent.innerHTML = html;
    $$('.opt').forEach(el=>{
        el.onclick = ()=>{
            const isCorrect = el.dataset.correct==="true";
            if(isCorrect){
                ansMsg.style.color="#4fdf85";
                ansMsg.innerText="✅回答正确！";
                spawnCelebrateParticles();
                if(state.level <4 && !state.unlock[state.level]){
                    state.unlock[state.level]=true;
                    ansMsg.innerText += " 已解锁下一关！";
                    updateUIByLevel();
                }
            }else{
                ansMsg.style.color="#ff6b6b";
                ansMsg.innerText="❌回答错误，请重新思考。";
            }
        }
    })
    modal.style.display='flex';
}

//鼠标事件
canvas.onmousemove = function(e){
    const rect = canvas.getBoundingClientRect();
    state.mouseX = e.clientX - rect.left;
    state.mouseY = e.clientY - rect.top;
    const eField = calcField(state.mouseX, state.mouseY);
    const mag = Math.hypot(eField.Ex, eField.Ey);
    $Ex.textContent = eField.Ex.toFixed(3);
    $Ey.textContent = eField.Ey.toFixed(3);
    $EMag.textContent = mag.toFixed(3);
}
canvas.onclick=e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const q = state.isNegative ? -state.Q : state.Q;
    let param={};
    if(state.chargeType==='ring'||state.chargeType==='disk')param.r=40;
    state.sources.push(new Source(mx,my,state.chargeType,q,param));
    state.dirty=true;
}
canvas.oncontextmenu=e=>{
    e.preventDefault();
    removeNearSource(state.mouseX,state.mouseY);
}

//触屏长按删除
let touchTimer = null;
let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    touchStartX = t.clientX - rect.left;
    touchStartY = t.clientY - rect.top;
    touchTimer = setTimeout(()=>{
        removeNearSource(touchStartX,touchStartY);
        state.dirty=true;
    },600);
})
canvas.addEventListener('touchend',e=>{
    clearTimeout(touchTimer);
})
canvas.addEventListener('touchmove',e=>{
    clearTimeout(touchTimer);
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    state.mouseX = t.clientX - rect.left;
    state.mouseY = t.clientY - rect.top;
})
function removeNearSource(x,y){
    let minI=-1,minD=70;
    state.sources.forEach((s,i)=>{
        const d=Math.hypot(s.x-x,s.y-y);
        if(d<minD){minD=d;minI=i}
    })
    if(minI>=0){
        state.sources.splice(minI,1);
        state.dirty=true;
    }
}

class Source{
    constructor(x,y,type,Q,param={}){
        this.x=x;this.y=y;this.type=type;this.Q=Q;
        this.r=param.r||40;
    }
    fieldAt(px,py){
        const dx = px - this.x;
        const dy = py - this.y;
        const r2 = dx*dx+dy*dy;
        const r = Math.sqrt(r2);
        const eps = 1e-6;
        if(r<eps) return {Ex:0,Ey:0};
        switch(this.type){
            case 'point':
                const E0 = this.Q / r;
                return {Ex: E0*dx/r, Ey: E0*dy/r};
            case 'line':
                const El = this.Q / r;
                return {Ex: El*dx/r, Ey: El*dy/r};
            case 'ring':{
                let ex=0,ey=0;
                const seg=40;
                for(let i=0;i<seg;i++){
                    const th = (i/seg)*Math.PI*2;
                    const cx = this.x + this.r*Math.cos(th);
                    const cy = this.y + this.r*Math.sin(th);
                    const ddx = px - cx;
                    const ddy = py - cy;
                    const dr = Math.hypot(ddx,ddy);
                    if(dr<eps) continue;
                    const dq = this.Q / seg;
                    const dE = dq/dr;
                    ex += dE * ddx/dr;
                    ey += dE * ddy/dr;
                }
                return {Ex:ex,Ey:ey};
            }
            case 'disk':{
                let ex=0,ey=0;
                const rings=20;
                const segs=32;
                for(let ri=1;ri<=rings;ri++){
                    const r = this.r * ri/rings;
                    const dR = this.r/rings;
                    const dqRing = this.Q * (2*Math.PI*r*dR)/(Math.PI*this.r*this.r);
                    for(let i=0;i<segs;i++){
                        const th = (i/segs)*Math.PI*2;
                        const cx = this.x + r*Math.cos(th);
                        const cy = this.y + r*Math.sin(th);
                        const ddx = px - cx;
                        const ddy = py - cy;
                        const dr = Math.hypot(ddx,ddy);
                        if(dr<eps) continue;
                        const dq = dqRing/segs;
                        const dE = dq/dr;
                        ex += dE * ddx/dr;
                        ey += dE * ddy/dr;
                    }
                }
                return {Ex:ex,Ey:ey};
            }
        }
        return {Ex:0,Ey:0};
    }
    potentialAt(px,py){
        const dx = px - this.x;
        const dy = py - this.y;
        const r = Math.hypot(dx,dy);
        const eps = 1e-6;
        if(r<eps) return 0;
        switch(this.type){
            case 'point':
                return this.Q * Math.log(1/r);
            case 'line':
                return this.Q * Math.log(1/r);
            case 'ring':{
                let V=0;
                const seg=40;
                for(let i=0;i<seg;i++){
                    const th = (i/seg)*Math.PI*2;
                    const cx = this.x + this.r*Math.cos(th);
                    const cy = this.y + this.r*Math.sin(th);
                    const dr = Math.hypot(px-cx, py-cy);
                    if(dr<eps) continue;
                    const dq = this.Q/seg;
                    V += dq*Math.log(1/dr);
                }
                return V;
            }
            case 'disk':{
                let V=0;
                const rings=20;
                const segs=32;
                for(let ri=1;ri<=rings;ri++){
                    const rr = this.r * ri/rings;
                    const dR = this.r/rings;
                    const dqRing = this.Q * (2*Math.PI*rr*dR)/(Math.PI*this.r*this.r);
                    for(let i=0;i<segs;i++){
                        const th = (i/segs)*Math.PI*2;
                        const cx = this.x + rr*Math.cos(th);
                        const cy = this.y + rr*Math.sin(th);
                        const dr = Math.hypot(px-cx, py-cy);
                        if(dr<eps) continue;
                        const dq = dqRing/segs;
                        V += dq*Math.log(1/dr);
                    }
                }
                return V;
            }
        }
        return 0;
    }
    draw(c){
        c.save();
        const color = this.Q>0 ? '#f44' : '#44f';
        c.fillStyle=color;
        if(this.type==='point'){
            c.beginPath();c.arc(this.x,this.y,9,0,Math.PI*2);c.fill();
        }else if(this.type==='line'){
            c.lineWidth=3;c.strokeStyle=color;
            c.beginPath();
            c.moveTo(this.x,0);c.lineTo(this.x,H);c.stroke();
        }else if(this.type==='ring'){
            c.lineWidth=3;c.strokeStyle=color;
            c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.stroke();
            c.beginPath();c.arc(this.x,this.y,6,0,Math.PI*2);c.fill();
        }else if(this.type==='disk'){
            c.globalAlpha=0.45;
            c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fill();
            c.globalAlpha=1;
            c.beginPath();c.arc(this.x,this.y,6,0,Math.PI*2);c.fill();
        }
        c.restore();
    }
}

function calcField(x,y){
    let Ex=0,Ey=0;
    for(let s of state.sources){
        const f = s.fieldAt(x,y);
        Ex += f.Ex;
        Ey += f.Ey;
    }
    return {Ex,Ey};
}
function calcPotential(x,y){
    let V=0;
    for(let s of state.sources){
        V += s.potentialAt(x,y);
    }
    return V;
}

function drawFieldLinesOffscreen(c, dashOffset=0){
    c.strokeStyle="#3cf";
    c.lineWidth=1.5;
    const totalLines = state.density;
    const sources = state.sources.filter(s=>Math.abs(s.Q)>0.01);
    if(sources.length===0) return;

    const totalQ = sources.reduce((sum,s)=>sum+Math.abs(s.Q),0);
    let drawn = 0;
    for(const src of sources){
        const weight = Math.abs(src.Q)/totalQ;
        let srcLineCnt = Math.round(totalLines * weight);
        srcLineCnt = Math.max(6, srcLineCnt);
        if(srcLineCnt <=0) continue;

        for(let i=0;i<srcLineCnt;i++){
            if(drawn >= totalLines) break;
            drawn++;
            const ang = (i/srcLineCnt)*Math.PI*2;
            const startR = src.type==="point"?12 : src.r+4;
            let x = src.x + Math.cos(ang)*startR;
            let y = src.y + Math.sin(ang)*startR;
            const reverse = src.Q < 0;

            c.beginPath();
            c.moveTo(x,y);
            const pathPoints = [{x,y}];
            for(let step=0;step<700;step++){
                const e = calcField(x,y);
                let mag = Math.hypot(e.Ex,e.Ey);
                if(mag < 0.0001 || !Number.isFinite(mag)) break;
                let dx = e.Ex/mag;
                let dy = e.Ey/mag;
                if(reverse){dx=-dx; dy=-dy;}
                const stepLen=3.8;
                x += dx*stepLen;
                y += dy*stepLen;
                if(x<0||x>W||y<0||y>H) break;
                let hit = false;
                for(const s2 of state.sources){
                    if(Math.hypot(x-s2.x,y-s2.y)<10) {hit=true;break;}
                }
                if(hit) break;
                c.lineTo(x,y);
                pathPoints.push({x,y});
            }
            //虚线流动效果
            c.setLineDash([8,6]);
            c.lineDashOffset = dashOffset;
            c.stroke();
            c.setLineDash([]);

            if(pathPoints.length>10){
                const idx = Math.floor(pathPoints.length * 0.65);
                const p = pathPoints[idx];
                const prevP = pathPoints[idx-1];
                const ang = Math.atan2(p.y-prevP.y, p.x-prevP.x);
                c.save();
                c.translate(p.x,p.y);
                c.rotate(ang);
                c.fillStyle="#3cf";
                c.beginPath();
                c.moveTo(0,0);
                c.lineTo(-9,-4);
                c.lineTo(-9,4);
                c.closePath();
                c.fill();
                c.restore();
            }
        }
    }
}

function drawEquipotentialOffscreen(c){
    if(!state.showEqui) return;
    const gridRes=20;
    const nx = Math.floor(W/gridRes);
    const ny = Math.floor(H/gridRes);
    const levels = [-4,-2,0,2,4];
    c.lineWidth=1;
    for(const level of levels){
        c.strokeStyle=`hsla(${180+level*12},80%,60%,0.4)`;
        c.beginPath();
        for(let j=0;j<ny-1;j++){
            for(let i=0;i<nx-1;i++){
                const x0 = i*gridRes;
                const y0 = j*gridRes;
                const v00 = calcPotential(x0,y0);
                const v10 = calcPotential(x0+gridRes,y0);
                const v11 = calcPotential(x0+gridRes,y0+gridRes);
                const v01 = calcPotential(x0,y0+gridRes);
                const caseBits = (v00>level?8:0)|(v10>level?1:0)|(v11>level?2:0)|(v01>level?4:0);
                if(caseBits===0||caseBits===15) continue;
                const lerp = (a,b)=>{
                    const t = (level-a)/(b-a);
                    return gridRes*t;
                };
                switch(caseBits){
                    case 1:
                        c.moveTo(x0+gridRes, y0+lerp(v10,v11));
                        c.lineTo(x0+lerp(v00,v01), y0);break;
                    case 2:
                        c.moveTo(x0+gridRes+lerp(v10,v11), y0+gridRes);
                        c.lineTo(x0+gridRes, y0+lerp(v10,v00));break;
                    case 3:
                        c.moveTo(x0+lerp(v00,v01), y0);
                        c.lineTo(x0+gridRes+lerp(v10,v11), y0+gridRes);break;
                    case 4:
                        c.moveTo(x0+lerp(v00,v01), y0+gridRes);
                        c.lineTo(x0, y0+lerp(v00,v10));break;
                    case 5:
                        c.moveTo(x0+lerp(v00,v01), y0);
                        c.lineTo(x0+lerp(v00,v01), y0+gridRes);break;
                    case 6:
                        c.moveTo(x0, y0+lerp(v00,v10));
                        c.lineTo(x0+gridRes+lerp(v10,v11), y0+gridRes);break;
                    case 7:
                        c.moveTo(x0+lerp(v00,v01), y0);
                        c.lineTo(x0, y0+lerp(v00,v10));break;
                    case 8:
                        c.moveTo(x0+lerp(v00,v01), y0+gridRes);
                        c.lineTo(x0+gridRes, y0+lerp(v10,v11));break;
                    case 9:
                        c.moveTo(x0, y0+lerp(v00,v10));
                        c.lineTo(x0+gridRes, y0+lerp(v10,v11));break;
                    case 10:
                        c.moveTo(x0+lerp(v00,v01), y0+gridRes);
                        c.lineTo(x0+gridRes+lerp(v10,v11), y0+gridRes);break;
                    case 11:
                        c.moveTo(x0, y0+lerp(v00,v10));
                        c.lineTo(x0+lerp(v00,v01), y0+gridRes);break;
                    case 12:
                        c.moveTo(x0+lerp(v00,v01), y0);
                        c.lineTo(x0+gridRes, y0+lerp(v10,v11));break;
                    case 13:
                        c.moveTo(x0+lerp(v00,v01), y0);
                        c.lineTo(x0+gridRes+lerp(v10,v11), y0+gridRes);break;
                    case 14:
                        c.moveTo(x0, y0+lerp(v00,v10));
                        c.lineTo(x0+lerp(v00,v01), y0);break;
                }
            }
        }
        c.stroke();
    }
}

function renderOffscreen(){
    offCtx.fillStyle='#050510';
    offCtx.fillRect(0,0,W,H);
    drawEquipotentialOffscreen(offCtx);
    drawFieldLinesOffscreen(offCtx, state.dashOffset);
    for(let s of state.sources)s.draw(offCtx);
    state.dirty=false;
}

function drawMain(){
    ctx.drawImage(offscreen,0,0);
}

let lastT=0;
function loop(t){
    const dt = Math.min((t-lastT)/1000,0.035);
    lastT=t;
    state.dashOffset += dt*20;
    if(state.dirty){
        renderOffscreen();
    }else{
        //仅更新虚线偏移，不需要重算场
        offCtx.clearRect(0,0,W,H);
        drawEquipotentialOffscreen(offCtx);
        drawFieldLinesOffscreen(offCtx, state.dashOffset);
        for(let s of state.sources)s.draw(offCtx);
    }
    drawMain();
    updateParticles(dt);
    requestAnimationFrame(loop);
}

updateUIByLevel();
renderOffscreen();
requestAnimationFrame(loop);
</script>
